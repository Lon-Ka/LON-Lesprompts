l": "Ik gebruik en versta begrippen over kansrekenen: kan, kan niet, altijd, niet, nooit, mogelijk, misschien, soms.", "checkvragen": ["Gebruikt \"kan\" of \"kan niet\" correct in een zin over een gebeurtenis.", "Gebruikt \"altijd\" of \"nooit\" correct om iets te beschrijven.", "Gebruikt \"misschien\" of \"soms\" correct om onzekerheid uit te drukken."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.5.2", "onderwerp": "Kansrekenen en statistiek", "subthema": "Kansrekenen", "doelzin": "De kleuters kunnen zekere en onzekere gebeurtenissen van elkaar onderscheiden. (< bv. ik poets vandaag mijn tanden/opa en oma komen vandaag misschien op bezoek >).", "ikdoel": "Ik onderscheid zekere en onzekere gebeurtenissen van elkaar.", "checkvragen": ["Benoemt of een gebeurtenis zeker of onzeker is (bv. \"ik poets vandaag mijn tanden\" versus \"opa en oma komen misschien op bezoek\").", "Geeft zelf een voorbeeld van een zekere gebeurtenis.", "Geeft zelf een voorbeeld van een onzekere gebeurtenis."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.5.3", "onderwerp": "Kansrekenen en statistiek", "subthema": "Kansrekenen", "doelzin": "De kleuters kunnen de waarschijnlijkheid van gebeurtenissen beschrijven door gebruik te maken van gepaste begrippen. (< bv. ik steek nooit over bij een rood licht/op donderdag hebben we altijd turnles >).", "ikdoel": "Ik beschrijf de waarschijnlijkheid van gebeurtenissen met gepaste begrippen.", "checkvragen": ["Beschrijft een gebeurtenis die altijd gebeurt met het woord \"altijd\" (bv. \"op donderdag hebben we altijd turnles\").", "Beschrijft een gebeurtenis die nooit gebeurt met het woord \"nooit\".", "Kiest het juiste waarschijnlijkheidswoord bij een gegeven gebeurtenis."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.5.4", "onderwerp": "Kansrekenen en statistiek", "subthema": "Statistiek", "doelzin": "De kleuters kunnen gegevens over de klas verzamelen, ordenen en voorstellen. (< bv. lievelingskleuren in de klas voorstellen met blokjes per gekozen kleur en de populairste kleur vinden als de kleur met het grootste aantal blokjes / grote vloer-matrix met op de rijen ‘trui/t-shirt dragen’ en op de kolommen ‘rood/geel/blauw/groen’ >).", "ikdoel": "Ik verzamel, orden en stel gegevens over de klas voor.", "checkvragen": ["Helpt gegevens verzamelen over de klas (bv. lievelingskleuren).", "Ordent verzamelde gegevens, bijvoorbeeld met blokjes per categorie.", "Leest af welke categorie het grootste aantal heeft in de voorstelling."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.6.1", "onderwerp": "Probleemoplossend denken en vraagstukken", "subthema": "Probleemoplossend denken", "doelzin": "De kleuters kunnen problemen in spel- en leersituaties oplossen gebruikmakend van wiskundige elementen, door: op zoek te gaan naar manieren om een probleem op te lossen, ook als er meerdere oplossingen zijn; concreet materiaal te gebruiken; hun ideeën te delen met anderen.", "ikdoel": "Ik los problemen in spel- en leersituaties op door gebruik te maken van wiskundige elementen: op zoek gaan naar manieren om een probleem op te lossen, ook als er meerdere oplossingen zijn, concreet materiaal gebruiken, en ideeën delen met anderen.", "checkvragen": ["Zoekt zelf naar een manier om een probleem tijdens spel op te lossen.", "Gebruikt concreet materiaal om een probleem op te lossen.", "Deelt de eigen oplossing of idee met een ander kind."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.1", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen de telrij van 0 tot en met 20 (akoestisch tellen) [F].", "ikdoel": "Ik ken de telrij van 0 tot en met 20 (akoestisch tellen).", "checkvragen": ["Telt hardop van 0 tot 20.", "Vervolgt het tellen wanneer de leerkracht een getal in de rij noemt.", "Telt terug van 20 tot 0, eventueel met hulp."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.2", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen natuurlijke getallen als aantal en als rangorde [I].", "ikdoel": "Ik ken natuurlijke getallen als aantal en als rangorde.", "checkvragen": ["Gebruikt een getal om een aantal aan te duiden (bv. \"5 knikkers\").", "Gebruikt een getal om een plaats in een rij aan te duiden (bv. \"de derde in de rij\").", "Legt het verschil uit tussen een getal als aantal en een getal als plaats in de rij, op eigen niveau."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.3", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen de rangtelwoorden van eerste tot en met tiende [F].", "ikdoel": "Ik ken de rangtelwoorden van eerste tot en met tiende.", "checkvragen": ["Benoemt correct de eerste, tweede of derde in een rij.", "Wijst het kind of voorwerp aan dat op een genoemde rangorde staat (bv. \"de vijfde\").", "Gebruikt een rangtelwoord correct tijdens een spel of activiteit."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.4", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen de één-op-één relatie tussen een aantal objecten en de overeenkomstige telwoorden (synchroon tellen) [I].", "ikdoel": "Ik ken de één-op-één relatie tussen een aantal objecten en de bijbehorende telwoorden (synchroon tellen).", "checkvragen": ["Wijst bij het tellen telkens één voorwerp aan per uitgesproken telwoord.", "Telt een rij voorwerpen correct zonder er een over te slaan of dubbel te tellen.", "Corrigeert zichzelf wanneer het merkt dat de aanwijzing en het telwoord niet synchroon lopen."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.5", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen de irrelevantie van de volgorde van objecten bij het bepalen van een aantal [I].", "ikdoel": "Ik weet dat de volgorde van objecten niet uitmaakt bij het bepalen van een aantal.", "checkvragen": ["Telt dezelfde groep voorwerpen twee keer in een andere volgorde en komt tot hetzelfde aantal.", "Bevestigt dat het aantal gelijk blijft, ongeacht hoe de voorwerpen geordend worden.", "Telt een groep voorwerpen die door elkaar liggen even correct als een geordende rij."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.6", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen het principe van conservatie (een aantal is onafhankelijk van tijd en ruimte) [I].", "ikdoel": "Ik ken het principe van conservatie: een aantal is onafhankelijk van tijd en ruimte.", "checkvragen": ["Bevestigt dat een aantal voorwerpen gelijk blijft nadat ze verplaatst of herschikt zijn.", "Telt een groep voorwerpen na verandering van opstelling en komt tot hetzelfde aantal als voordien.", "Legt op eigen niveau uit dat het aantal niet verandert door de voorwerpen anders te leggen."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.7", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kennen de volgende begrippen [F]: evenveel, niet-evenveel; veel/weinig, gelijk/niet gelijk, te veel/te weinig; meer, minder, meest, minst, tussen, één meer/één minder; van minder naar meer, van weinig naar veel; eerste, middelste, laatste, vorige, volgende; hoeveel, geen enkel, niets, hoeveel meer, hoeveel minder; juist ervoor, juist erna.", "ikdoel": "Ik gebruik en versta begrippen over aantallen: evenveel, niet-evenveel, veel/weinig, meer, minder, meest, minst, tussen, één meer/één minder, eerste, middelste, laatste, vorige, volgende, hoeveel, geen enkel, niets, juist ervoor, juist erna.", "checkvragen": ["Benoemt correct welke groep \"meer\" of \"minder\" voorwerpen heeft.", "Wijst de eerste, middelste of laatste aan in een rij.", "Benoemt het getal dat \"juist ervoor\" of \"juist erna\" komt bij een gegeven getal."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.8", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kunnen (on)gestructureerde aantallen tot en met 10: vergelijken; sorteren; tellen (resultatief tellen); koppelen aan het telwoord en de getalnotatie (in alle richtingen); van weinig naar veel of omgekeerd ordenen (seriëren).", "ikdoel": "Ik vergelijk, sorteer, tel, koppel aan telwoord en getalnotatie, en orden (on)gestructureerde aantallen tot en met 10.", "checkvragen": ["Telt een groep voorwerpen tot 10 correct (resultatief tellen).", "Koppelt een geteld aantal aan het juiste cijfer.", "Legt twee groepen voorwerpen van weinig naar veel, of omgekeerd."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.9", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kunnen (on)gestructureerde aantallen tot en met 5 herkennen zonder te tellen (subiteren).", "ikdoel": "Ik herken (on)gestructureerde aantallen tot en met 5 zonder te tellen (subiteren).", "checkvragen": ["Benoemt onmiddellijk het aantal van een kleine, herkenbare groep (bv. dobbelsteenpatroon) zonder te tellen.", "Herkent een aantal tot 5 in een ongestructureerde opstelling zonder te tellen.", "Reageert sneller op een subiteerbaar aantal dan wanneer het moet tellen."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.10", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kunnen met behulp van de telrij: vanaf een willekeurige plaats tot en met 10 tellen, doortellen en terugtellen; 1 meer en 1 minder, juist ervoor en juist erna bepalen bij een gegeven getal tot en met 10.", "ikdoel": "Ik tel met behulp van de telrij vanaf een willekeurige plaats tot en met 10, tel door en terug, en bepaal 1 meer en 1 minder, juist ervoor en juist erna bij een gegeven getal tot en met 10.", "checkvragen": ["Telt verder vanaf een gegeven getal tussen 0 en 10.", "Telt terug vanaf een gegeven getal tot en met 10.", "Benoemt correct het getal dat 1 meer of 1 minder is dan een gegeven getal."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.11", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kunnen een rangorde tot en met 10 aangeven.", "ikdoel": "Ik geef een rangorde tot en met 10 aan.", "checkvragen": ["Legt voorwerpen in de juiste volgorde van 1 tot 10.", "Benoemt de juiste plaats van een voorwerp in een gerangschikte rij tot 10.", "Herstelt de juiste rangorde wanneer twee voorwerpen verwisseld zijn."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.1.12", "onderwerp": "Getallenkennis", "subthema": "Natuurlijke getallen", "doelzin": "De kleuters kunnen getallen (in cijfers) tot en met 10 lezen.", "ikdoel": "Ik lees getallen (in cijfers) tot en met 10.", "checkvragen": ["Benoemt correct het getal dat getoond wordt, tot en met 10.", "Wijst het juiste cijfer aan wanneer een getal genoemd wordt.", "Herkent hetzelfde cijfer in verschillende lettertypes of schrijfwijzen."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.1.1", "onderwerp": "Organismen", "subthema": "Classificatie van organismen", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot organismen: de fauna, de zoogdieren, de vogels, de vissen, de insecten, de flora.", "ikdoel": "Ik benoem de fauna, zoogdieren, vogels, vissen, insecten en de flora.", "checkvragen": ["Benoemt een zoogdier, vogel, vis of insect wanneer het getoond wordt.", "Gebruikt het woord \"fauna\" of \"flora\" correct tijdens een activiteit over dieren en planten.", "Sorteert een dier bij de juiste diergroep (bv. vogel, vis) op vraag."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.1.2", "onderwerp": "Organismen", "subthema": "Classificatie van organismen", "doelzin": "De kleuters kunnen: organismen beschrijven op basis van waarneembare kenmerken; fauna beschrijven op basis van voortplantingswijze.", "ikdoel": "Ik beschrijf organismen op basis van waarneembare kenmerken, en dieren op basis van hoe ze jongen krijgen.", "checkvragen": ["Beschrijft een waarneembaar kenmerk van een dier of plant (bv. \"heeft veren\", \"heeft bladeren\").", "Benoemt of een dier eieren legt of levende jongen krijgt, bij een bekend voorbeeld.", "Vergelijkt twee dieren op basis van een zichtbaar kenmerk."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.1.3", "onderwerp": "Organismen", "subthema": "Ontwikkeling en voortplanting van organismen", "doelzin": "De kleuters kennen de volgende begrippen in verband met de levenscyclus: geboren worden, kiemen, groeien, sterven.", "ikdoel": "Ik gebruik en versta de begrippen geboren worden, kiemen, groeien en sterven.", "checkvragen": ["Benoemt correct of iets \"geboren wordt\" of \"kiemt\" bij een dier of plant.", "Vertelt dat een plant of dier groeit, bij observatie over tijd (bv. een zaadje dat plant wordt).", "Gebruikt het woord \"sterven\" correct in een gesprek over de levenscyclus."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.1.4", "onderwerp": "Organismen", "subthema": "Ontwikkeling en voortplanting van organismen", "doelzin": "De kleuters kennen de fasen van de levenscyclus: geboorte/kieming, groei, voortplanting, dood.", "ikdoel": "Ik ken de fasen van de levenscyclus: geboorte of kieming, groei, voortplanting en dood.", "checkvragen": ["Legt afbeeldingen van de levenscyclus van een dier of plant in de juiste volgorde.", "Benoemt welke fase van de levenscyclus getoond wordt op een afbeelding.", "Vertelt tijdens een activiteit (bv. zaadjes planten) in welke fase een organisme zich bevindt."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.2.1", "onderwerp": "Relatie tussen organismen en tussen organismen en omgevingsfactoren in een biotoop", "subthema": "Relatie tussen organismen onderling en hun omgeving", "doelzin": "De kleuters kennen het principe van eten en gegeten worden.", "ikdoel": "Ik ken het principe van eten en gegeten worden.", "checkvragen": ["Benoemt welk dier een ander dier opeet, bij een eenvoudig voorbeeld.", "Legt uit dat een dier moet eten om te overleven.", "Herkent tijdens een verhaal of activiteit een eenvoudige \"wie-eet-wie\"-relatie."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.2.2", "onderwerp": "Relatie tussen organismen en tussen organismen en omgevingsfactoren in een biotoop", "subthema": "Energiebronnen en voedingsstoffen", "doelzin": "De kleuters kennen verschillende voedingsmiddelen.", "ikdoel": "Ik ken verschillende voedingsmiddelen.", "checkvragen": ["Benoemt minstens drie voedingsmiddelen wanneer die getoond worden.", "Herkent een voedingsmiddel tijdens een activiteit rond eten (bv. fruit, groenten).", "Sorteert voedingsmiddelen in een groep (bv. fruit versus groenten)."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.2.3", "onderwerp": "Relatie tussen organismen en tussen organismen en omgevingsfactoren in een biotoop", "subthema": "Energiebronnen en voedingsstoffen", "doelzin": "De kleuters weten dat mensen eten en drinken om te groeien en te bewegen.", "ikdoel": "Ik weet dat mensen eten en drinken om te groeien en te bewegen.", "checkvragen": ["Legt uit waarom mensen eten (bv. \"om groot te worden\", \"om energie te hebben\").", "Vertelt tijdens een gesprek dat drinken nodig is om te kunnen bewegen of spelen.", "Herkent bij een activiteit dat eten en drinken je helpt groeien."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.2.4", "onderwerp": "Relatie tussen organismen en tussen organismen en omgevingsfactoren in een biotoop", "subthema": "Energiebronnen en voedingsstoffen", "doelzin": "De kleuters kunnen aangeven dat je moet eten wanneer je honger hebt en drinken wanneer je dorst hebt.", "ikdoel": "Ik geef aan dat ik moet eten wanneer ik honger heb en drinken wanneer ik dorst heb.", "checkvragen": ["Zegt of toont wanneer het honger of dorst heeft.", "Vraagt zelfstandig om eten of drinken op een geschikt moment.", "Benoemt het verschil tussen honger en dorst tijdens een gesprek."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.3.1", "onderwerp": "Menselijk lichaam", "subthema": "Fysieke functies van de mens", "doelzin": "De kleuters kennen de volgende begrippen: de spieren, de botten, de longen, het hart, de maag, de ogen, de oren, de neus, de mond, de huid; bewegen, steunen, ademen, de hartslag, de honger, de dorst; zien, horen, ruiken, proeven, voelen.", "ikdoel": "Ik gebruik en versta lichaamsbegrippen: lichaamsdelen zoals spieren, botten, longen, hart, maag, ogen, oren, neus, mond en huid; functies zoals bewegen, steunen, ademen, de hartslag, honger en dorst; en de zintuigen zien, horen, ruiken, proeven en voelen.", "checkvragen": ["Benoemt minstens drie lichaamsdelen wanneer die getoond worden.", "Koppelt een zintuig (bv. zien, horen) aan het juiste lichaamsdeel (ogen, oren).", "Gebruikt een functiewoord zoals \"ademen\" of \"bewegen\" correct tijdens een activiteit."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.3.2", "onderwerp": "Menselijk lichaam", "subthema": "Fysieke functies van de mens", "doelzin": "De kleuters kennen lichaamsdelen en hun functie: spieren, botten, longen, hart, maag, ogen, oren, neus, mond, huid.", "ikdoel": "Ik ken lichaamsdelen en hun functie: spieren, botten, longen, hart, maag, ogen, oren, neus, mond, huid.", "checkvragen": ["Benoemt de functie van een lichaamsdeel wanneer het getoond wordt (bv. \"de ogen zijn om te zien\").", "Koppelt een lichaamsdeel aan de juiste functie in een spel of activiteit.", "Legt uit waarvoor het hart of de longen dienen, op eigen niveau."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.3.3", "onderwerp": "Menselijk lichaam", "subthema": "Fysieke functies van de mens", "doelzin": "De kleuters kunnen deze lichaamsdelen op het eigen lichaam aanduiden en benoemen.", "ikdoel": "Ik duid deze lichaamsdelen aan op mijn eigen lichaam en benoem ze.", "checkvragen": ["Wijst op vraag een lichaamsdeel aan op het eigen lichaam.", "Benoemt correct een lichaamsdeel waar de leerkracht naar wijst.", "Wijst tijdens een lied of spel (bv. \"hoofd, schouders, knie en teen\") de juiste lichaamsdelen aan."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.4.1", "onderwerp": "Eigenschappen van materie", "subthema": null, "doelzin": "De kleuters kunnen materie sorteren op basis van waarneembare eigenschappen.", "ikdoel": "Ik sorteer materie op basis van waarneembare eigenschappen.", "checkvragen": ["Sorteert voorwerpen op een waarneembare eigenschap (bv. kleur, grootte, gewicht).", "Benoemt waarom een voorwerp bij een bepaalde groep hoort.", "Vergelijkt twee voorwerpen op basis van een eigenschap (bv. \"dit is zwaarder\")."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.5.1", "onderwerp": "Natuurkundige verschijnselen", "subthema": null, "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot natuurkundige verschijnselen: de zon, de lamp, licht, donker, de schaduw, de spiegel; het stopcontact, de batterij; aantrekken, afstoten, de magneet, magnetisch.", "ikdoel": "Ik gebruik en versta begrippen over licht (de zon, de lamp, licht, donker, de schaduw, de spiegel), elektriciteit (het stopcontact, de batterij) en magnetisme (aantrekken, afstoten, de magneet, magnetisch).", "checkvragen": ["Benoemt de zon, een lamp of een spiegel wanneer die getoond worden.", "Wijst een stopcontact of batterij aan en benoemt dat die voor elektriciteit zorgen.", "Benoemt of een magneet iets aantrekt of afstoot tijdens een activiteit."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.5.2", "onderwerp": "Natuurkundige verschijnselen", "subthema": null, "doelzin": "De kleuters kennen licht: de lichtbron, de reflectie.", "ikdoel": "Ik ken de lichtbron en reflectie.", "checkvragen": ["Benoemt een lichtbron (bv. de zon, een lamp) wanneer die getoond wordt.", "Herkent een spiegel of glimmend oppervlak als iets dat licht weerkaatst.", "Speelt tijdens een activiteit met licht en reflectie (bv. met een spiegel)."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.5.3", "onderwerp": "Natuurkundige verschijnselen", "subthema": null, "doelzin": "De kleuters kennen geluid: hard, zacht.", "ikdoel": "Ik ken geluid: hard en zacht.", "checkvragen": ["Benoemt of een geluid hard of zacht is wanneer het klinkt.", "Maakt zelf een hard en een zacht geluid op vraag.", "Reageert gepast op een hard of zacht geluidssignaal tijdens een activiteit."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.5.4", "onderwerp": "Natuurkundige verschijnselen", "subthema": null, "doelzin": "De kleuters kennen magnetisme (eigenschappen van magneten: aantrekken, afstoten).", "ikdoel": "Ik ken magnetisme: dat een magneet iets kan aantrekken of afstoten.", "checkvragen": ["Test met een magneet of die een voorwerp aantrekt.", "Benoemt of twee magneten elkaar aantrekken of afstoten tijdens een activiteit.", "Gebruikt het woord \"magneet\" correct tijdens een activiteit."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.5.5", "onderwerp": "Natuurkundige verschijnselen", "subthema": null, "doelzin": "De kleuters kunnen magnetische en niet-magnetische materialen onderscheiden.", "ikdoel": "Ik onderscheid magnetische en niet-magnetische materialen.", "checkvragen": ["Test met een magneet welke voorwerpen magnetisch zijn.", "Sorteert voorwerpen in \"magnetisch\" en \"niet-magnetisch\" na een test.", "Benoemt een magnetisch en een niet-magnetisch materiaal."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.6.1", "onderwerp": "Systematische en methodische benadering van wetenschappelijke en technologische problemen", "subthema": "Onderzoekende houding", "doelzin": "De kleuters kennen de relatie tussen oorzaak en gevolg.", "ikdoel": "Ik ken de relatie tussen oorzaak en gevolg.", "checkvragen": ["Benoemt een gevolg wanneer een oorzaak getoond wordt (bv. \"als je duwt, valt het om\").", "Voorspelt tijdens een activiteit wat er zal gebeuren als iets gebeurt.", "Legt uit waarom iets gebeurde tijdens een eenvoudige proef."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.6.2", "onderwerp": "Systematische en methodische benadering van wetenschappelijke en technologische problemen", "subthema": "Onderzoekende houding", "doelzin": "De kleuters kunnen aangeleerde woordenschat inzetten om te redeneren over een wetenschappelijke vraag.", "ikdoel": "Ik gebruik aangeleerde woordenschat om te redeneren over een wetenschappelijke vraag.", "checkvragen": ["Gebruikt een aangeleerd begrip (bv. \"magneet\", \"kiemen\") correct in een antwoord op een vraag.", "Formuleert een eigen idee bij een eenvoudige wetenschappelijke vraag.", "Legt met eigen woorden uit wat er tijdens een proef gebeurde."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.6.3", "onderwerp": "Systematische en methodische benadering van wetenschappelijke en technologische problemen", "subthema": "Ontwerpend leren", "doelzin": "De kleuters weten dat voorwerpen en materialen een functie hebben en ontworpen zijn om een probleem op te lossen.", "ikdoel": "Ik weet dat voorwerpen en materialen een functie hebben en ontworpen zijn om een probleem op te lossen.", "checkvragen": ["Benoemt de functie van een alledaags voorwerp (bv. \"een paraplu is om droog te blijven\").", "Legt uit welk probleem een voorwerp oplost tijdens een activiteit.", "Herkent dat een voorwerp speciaal gemaakt is voor een bepaald doel."]}, {"niveau": "kleuter", "vak": "Wetenschap en techniek", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "3.7.1", "onderwerp": "Technologie", "subthema": "Technische systemen hanteren", "doelzin": "De kleuters kunnen leeftijdsadequate technische systemen correct en veilig gebruiken.", "ikdoel": "Ik gebruik leeftijdsadequate technische systemen correct en veilig.", "checkvragen": ["Gebruikt een eenvoudig technisch voorwerp (bv. een schaar, een klein toestel) op de juiste manier.", "Volgt een veiligheidsafspraak bij het gebruik van een technisch voorwerp.", "Vraagt hulp bij een technisch voorwerp dat het nog niet zelfstandig kan gebruiken."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.1.1", "onderwerp": "Topografie", "subthema": "Topografisch referentiekader", "doelzin": "De kleuters kennen de naam van: ​​​​​​ (België; een plaatselijke rivier; de rivier de Nijl).", "ikdoel": "Ik benoem België, een rivier uit mijn buurt en de Nijl wanneer ze getoond of genoemd worden.", "checkvragen": ["Wijst België aan op een kaart, puzzel of globe en benoemt het.", "Benoemt de rivier uit de eigen omgeving tijdens een wandeling, uitstap of gesprek erover.", "Herkent en benoemt de Nijl wanneer die voorkomt in een prentenboek, kaart of activiteit."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.1.2", "onderwerp": "Topografie", "subthema": "Topografisch referentiekader", "doelzin": "De kleuters kunnen water, land en de polen op de wereldbol aanduiden.", "ikdoel": "Ik wijs water, land en de polen aan op een wereldbol.", "checkvragen": ["Wijst op de globe een gebied met water aan.", "Wijst op de globe een gebied met land aan.", "Wijst de Noordpool of de Zuidpool aan op de wereldbol."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.1.3", "onderwerp": "Topografie", "subthema": "Relatieve en absolute ligging", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot relatieve ligging: dichtbij, veraf, voor, achter, opzij, boven, onder, tussen, binnen, buiten, hoog, laag, in, uit, naast, midden.", "ikdoel": "Ik gebruik en versta plaatsbepalende woorden zoals dichtbij, veraf, voor, achter, boven, onder, tussen, binnen, buiten, in, uit en midden.", "checkvragen": ["Voert een opdracht met een van deze woorden correct uit (bv. \"ga achter de stoel staan\").", "Gebruikt spontaan een van deze woorden om te beschrijven waar iets of iemand zich bevindt.", "Wijst het juiste voorwerp of de juiste plaats aan wanneer de leerkracht een van deze begrippen benoemt."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.1.4", "onderwerp": "Topografie", "subthema": "Relatieve en absolute ligging", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot absolute plaatsbepaling: de straatnaam en het huisnummer; de Noordpool, de Zuidpool.", "ikdoel": "Ik noem mijn straatnaam en huisnummer, en benoem de Noordpool en de Zuidpool.", "checkvragen": ["Zegt op vraag de eigen straatnaam.", "Zegt op vraag het eigen huisnummer.", "Benoemt de Noordpool en de Zuidpool wanneer ze getoond worden op een kaart of globe."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.1", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kenmerken van de aarde en haar atmosfeer", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot kenmerken van de aarde en haar atmosfeer: het land, het water, de lucht, de rots, de grot, het zand.", "ikdoel": "Ik benoem het land, het water, de lucht, de rots, de grot en het zand.", "checkvragen": ["Benoemt land en water correct op een afbeelding of tijdens buitenspel.", "Benoemt zand wanneer het getoond wordt of tijdens spel in de zandbak.", "Wijst een rots of een grot aan op een prent of foto."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.2", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot natuurlijke aspecten van landschappen: de reliëfvorm: de berg, de heuvel, de vallei; de helling: omhoog, omlaag, steil, zacht; het water: de oceaan, de zee, het strand, de rivier, de beek, de plas, de vijver; de vegetatie: de boom, het bos, het gras, het grasland, de weide, het riet, het gazon; de bodem: vruchtbaar, zanderig, rotsachtig.", "ikdoel": "Ik benoem landschapskenmerken zoals berg, heuvel en vallei (reliëf), omhoog/omlaag/steil/zacht (helling), oceaan/zee/strand/rivier/beek/plas/vijver (water), boom/bos/gras/weide (vegetatie) en vruchtbaar/zanderig/rotsachtig (bodem).", "checkvragen": ["Benoemt minstens twee reliëfvormen (bv. berg, heuvel, vallei) op een afbeelding.", "Benoemt minstens twee soorten water in het landschap (bv. zee, rivier, plas) op een afbeelding of tijdens een uitstap.", "Benoemt minstens twee vegetatie- of bodemkenmerken (bv. bos, gras, zand) tijdens buitenspel of op een afbeelding."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.2a", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "reliëfvorm: de berg, de heuvel, de vallei", "ikdoel": "Ik benoem reliëfvormen: de berg, de heuvel en de vallei.", "checkvragen": ["Wijst een berg aan op een foto, prent of in een landschapsmaquette.", "Benoemt een heuvel wanneer die getoond wordt of tijdens een wandeling.", "Wijst of benoemt een vallei op een afbeelding."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.2b", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de helling: omhoog, omlaag, steil, zacht", "ikdoel": "Ik benoem een helling als omhoog, omlaag, steil of zacht.", "checkvragen": ["Beschrijft tijdens buitenspel of op een foto of een helling omhoog of omlaag gaat.", "Wijst een steile helling aan, in tegenstelling tot een zachte (glooiende) helling.", "Gebruikt het woord \"steil\" of \"zacht\" om een helling te beschrijven tijdens een activiteit of wandeling."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.2c", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "het water: de oceaan, de zee, het strand, de rivier, de beek, de plas, de vijver", "ikdoel": "Ik benoem waterelementen in een landschap: oceaan, zee, strand, rivier, beek, plas, vijver.", "checkvragen": ["Benoemt minstens twee soorten water (bv. zee, rivier) op een afbeelding.", "Wijst een plas of vijver aan tijdens buitenspel of op een foto.", "Herkent het strand op een foto of prent en benoemt het."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.2d", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de vegetatie: de boom, het bos, het gras, het grasland, de weide, het riet, het gazon", "ikdoel": "Ik benoem vegetatie in een landschap: boom, bos, gras, grasland, weide, riet, gazon.", "checkvragen": ["Benoemt een boom en/of bos op een foto of tijdens buitenspel.", "Wijst gras of een gazon aan in de eigen omgeving.", "Benoemt minstens één ander vegetatie-element (bv. weide, riet) op een afbeelding."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.2e", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de bodem: vruchtbaar, zanderig, rotsachtig", "ikdoel": "Ik benoem een bodem als vruchtbaar, zanderig of rotsachtig.", "checkvragen": ["Herkent zanderige bodem tijdens buitenspel (bv. in de zandbak) en benoemt die.", "Wijst een rotsachtige bodem aan op een foto of prent.", "Gebruikt het woord \"vruchtbaar\" in een gesprek over een moestuin of plantenbak."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot infrastructuur en hun interactie met landschappen: het wonen: het huis, het appartement, de tuin; de transportinfrastructuur: de weg, de straat, de bus, het spoor, de trein; de landbouw: de akker, de boerderij, de stal, de koe, het schaap, het varken, het gewas; de industrie: de fabriek, de werkplaats; de handel en de diensten: de winkel, de markt, de bakkerij; de recreatie en het toerisme: het zwembad, de zee, het park, de bibliotheek.", "ikdoel": "Ik benoem elementen van infrastructuur in een landschap, zoals huis/appartement/tuin (wonen), weg/bus/trein (transport), boerderij/koe/schaap (landbouw), fabriek (industrie), winkel/markt (handel) en zwembad/park (recreatie).", "checkvragen": ["Benoemt minstens één element van wonen (bv. huis, tuin) op een afbeelding of tijdens een wandeling.", "Benoemt minstens één transportmiddel of -infrastructuur (bv. bus, trein, weg).", "Benoemt minstens één element van landbouw, handel of recreatie (bv. boerderij, winkel, zwembad)."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3a", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "het wonen: het huis, het appartement, de tuin", "ikdoel": "Ik benoem het huis, het appartement en de tuin.", "checkvragen": ["Benoemt het eigen huis of appartement wanneer ernaar gevraagd wordt.", "Wijst een tuin aan op een foto of tijdens een wandeling.", "Herkent het verschil tussen een huis en een appartement op een afbeelding."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3b", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de transportinfrastructuur: de weg, de straat, de bus, het spoor, de trein", "ikdoel": "Ik benoem de weg, de straat, de bus, het spoor en de trein.", "checkvragen": ["Benoemt een bus of trein wanneer die voorbijkomt of op een afbeelding staat.", "Wijst de straat of de weg aan tijdens buitenspel of een wandeling.", "Herkent spoorrails op een foto of prent en benoemt ze."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3c", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de landbouw: de akker, de boerderij, de stal, de koe, het schaap, het varken, het gewas", "ikdoel": "Ik benoem de akker, de boerderij, de stal en dieren of gewassen zoals de koe, het schaap, het varken.", "checkvragen": ["Benoemt minstens één boerderijdier (koe, schaap of varken) op een afbeelding.", "Wijst een boerderij of stal aan op een foto of prent.", "Herkent een akker of gewas tijdens een uitstap of op een afbeelding."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3d", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de industrie: de fabriek, de werkplaats", "ikdoel": "Ik benoem de fabriek en de werkplaats.", "checkvragen": ["Wijst een fabriek aan op een foto of prent.", "Benoemt een werkplaats (bv. van een schrijnwerker of garage) wanneer die getoond wordt.", "Herkent het verschil tussen een fabriek en een huis op een afbeelding."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3e", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de handel en de diensten: de winkel, de markt, de bakkerij", "ikdoel": "Ik benoem de winkel, de markt en de bakkerij.", "checkvragen": ["Benoemt de winkel of bakkerij tijdens een uitstap of rollenspel.", "Wijst een markt aan op een foto of prent.", "Speelt \"winkeltje\" en benoemt daarbij correct winkel of markt."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.3f", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de recreatie en het toerisme: het zwembad, de zee, het park, de bibliotheek", "ikdoel": "Ik benoem het zwembad, de zee, het park en de bibliotheek.", "checkvragen": ["Benoemt het zwembad of het park wanneer ernaar gevraagd wordt.", "Wijst de bibliotheek aan op een foto of herkent die bij een bezoek.", "Benoemt de zee als een plaats om naartoe te gaan (herkent op foto/prent)."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.4", "onderwerp": "Aardrijkskundige kennis", "subthema": "Weer en klimaat", "doelzin": "De kleuters kennen de volgende begrippen met betrekking tot weersverschijnselen: de temperatuur; de neerslag; de bewolking; de wind.", "ikdoel": "Ik benoem weersverschijnselen: temperatuur, neerslag, bewolking en wind.", "checkvragen": ["Beschrijft tijdens het dagelijkse weerpraatje of het warm of koud is (temperatuur).", "Benoemt of het regent, sneeuwt of droog is (neerslag).", "Wijst of benoemt wolken of wind tijdens buitenspel of het weerpraatje."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.5", "onderwerp": "Aardrijkskundige kennis", "subthema": "Weer en klimaat", "doelzin": "De kleuters kunnen de relatie tussen bewolking en neerslag beschrijven", "ikdoel": "Ik leg uit dat neerslag komt uit bewolkte lucht.", "checkvragen": ["Zegt tijdens het weerpraatje dat het gaat regenen omdat het bewolkt is (of omgekeerd).", "Koppelt op een prent een wolk aan regen.", "Beantwoordt de vraag \"waarom regent het?\" met een verwijzing naar wolken."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.6", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kosmografie", "doelzin": "De kleuters kennen de volgende begrippen: de aarde, de maan, de zon, de sterren; de dag en de nacht.", "ikdoel": "Ik benoem de aarde, de maan, de zon en de sterren, en het verschil tussen dag en nacht.", "checkvragen": ["Benoemt de zon en de maan correct op een afbeelding.", "Benoemt de aarde en/of sterren op een afbeelding of globe.", "Zegt of een afbeelding dag of nacht voorstelt."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.7", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kosmografie", "doelzin": "De kleuters kunnen het ritme van de seizoenen in de directe omgeving herkennen.", "ikdoel": "Ik herken het seizoen aan kenmerken uit mijn omgeving.", "checkvragen": ["Benoemt het huidige seizoen tijdens de kringkalender.", "Koppelt een kenmerk (bv. bladeren, sneeuw, bloemen) aan het juiste seizoen.", "Merkt spontaan een seizoensverandering op tijdens buitenspel (bv. \"de blaadjes vallen\")."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.2.8", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kosmografie", "doelzin": "De kleuters kunnen de beweging van de aarde om haar as tonen met behulp van een wereldbol.", "ikdoel": "Ik toon met een wereldbol dat de aarde draait.", "checkvragen": ["Laat de globe ronddraaien wanneer gevraagd wordt de beweging van de aarde te tonen.", "Benoemt of gebaart dat de aarde \"draait\" tijdens een activiteit met de globe.", "Herkent de globe als een model van de (draaiende) aarde."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.3.1", "onderwerp": "Aardrijkskundige vaardigheden, onderzoek en denken", "subthema": "Aardrijkskundige bronnen en vaardigheden", "doelzin": "De kleuters kunnen een ruimtelijke indeling van een kamer en een buitenruimte beschrijven door observatie en geheugen.", "ikdoel": "Ik beschrijf hoe een kamer of buitenruimte is ingedeeld, ook uit het geheugen.", "checkvragen": ["Beschrijft tijdens een kringgesprek waar dingen staan in de klas of op de speelplaats.", "Herinnert zich na een bezoek waar iets stond, zonder er nog te staan.", "Wijst in een tekening of op een foto de plaats van een voorwerp of ruimte aan."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.3.2", "onderwerp": "Aardrijkskundige vaardigheden, onderzoek en denken", "subthema": "Aardrijkskundige bronnen en vaardigheden", "doelzin": "De kleuters kunnen een geobserveerde ruimte weergeven door middel van een eenvoudige tekening of schets.", "ikdoel": "Ik teken of schets een ruimte die ik heb waargenomen.", "checkvragen": ["Maakt een eenvoudige tekening van de klas, tuin of speelplaats na observatie.", "Plaatst herkenbare elementen (bv. tafel, boom) op de juiste plaats in de tekening.", "Legt uit wat de tekening voorstelt wanneer ernaar gevraagd wordt."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.3.3", "onderwerp": "Aardrijkskundige vaardigheden, onderzoek en denken", "subthema": "Aardrijkskundige bronnen en vaardigheden", "doelzin": "De kleuters kunnen een neerslagvorm observeren: regen, sneeuw, hagel, mist.", "ikdoel": "Ik herken en benoem regen, sneeuw, hagel of mist wanneer ik ze waarneem.", "checkvragen": ["Benoemt correct welke neerslagvorm buiten waarneembaar is.", "Herkent regen, sneeuw, hagel of mist op een foto of prent.", "Meldt spontaan een neerslagvorm tijdens buitenspel of bij het raam."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.3.4", "onderwerp": "Aardrijkskundige vaardigheden, onderzoek en denken", "subthema": "Aardrijkskundig denken", "doelzin": "De kleuters kunnen een actueel ruimtelijk vraagstuk bespreken in termen van gevolgen en relatieve meting. (< bv. waar een stoel positioneren om meer ruimte te maken, tramhalte gelegen op een nuttige/veilige plaats, hoeveel hoger of dichter bij het raam planten zetten om ze meer licht te geven >).", "ikdoel": "Ik denk mee na over waar iets het best past en wat daarvan het gevolg is.", "checkvragen": ["Geeft een voorstel bij een ruimtelijke vraag in de klas (bv. waar een stoel zetten voor meer ruimte).", "Benoemt een gevolg van een plaatsingskeuze (bv. \"dan kunnen we er niet meer langs\").", "Vergelijkt twee plaatsen in termen van dichter/verder of hoger/lager bij een concrete vraag."]}, {"niveau": "kleuter", "vak": "Aardrijkskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "4.3.5", "onderwerp": "Aardrijkskundige vaardigheden, onderzoek en denken", "subthema": "Aardrijkskundig denken", "doelzin": "De kleuters kunnen ideeën genereren om actuele ruimtelijke problemen op te lossen met behulp van relatieve ruimtelijke begrippen.", "ikdoel": "Ik bedenk een oplossing voor een ruimtelijk probleem, met woorden zoals dichterbij, verder of hoger.", "checkvragen": ["Stelt zelf een oplossing voor bij een ruimtelijk probleem in de klas.", "Gebruikt een relatief ruimtelijk begrip (bv. \"dichterbij\", \"hoger\") om de oplossing te verwoorden.", "Legt uit waarom de voorgestelde oplossing het probleem aanpakt."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.1.1", "onderwerp": "Kennis van het verleden", "subthema": "Prehistorie", "doelzin": "De kleuters weten hoe mensen tijdens de prehistorie overleefden en samenleefden. (ontwikkelingen: het gebruik van vuur, jagen, voedsel verzamelen, werktuigen (steen en been), grot- en muurschilderingen; personen en groepen: kleine groep (stam)).", "ikdoel": "Ik vertel hoe mensen in de prehistorie leefden: met vuur, door te jagen en voedsel te verzamelen, met werktuigen van steen en been, en in een kleine groep (stam).", "checkvragen": ["Benoemt of speelt na dat prehistorische mensen vuur gebruikten of jaagden, tijdens een activiteit of verhaal over de prehistorie.", "Herkent een grot- of muurschildering op een afbeelding en koppelt die aan \"heel lang geleden\".", "Benoemt dat mensen toen in een kleine groep leefden, na een verhaal of activiteit hierover."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.1.2", "onderwerp": "Kennis van het verleden", "subthema": "Oudheid", "doelzin": "De kleuters weten hoe mensen tijdens de oudheid overleefden en samenleefden. (Egyptische samenleving; ontwikkelingen: schrift (hiërogliefen, de Steen van Rosetta, papyrus), bouwen en begraven; plaatsen: de Nijl, de piramides van Gizeh; personen en groepen: boer, priester, farao).", "ikdoel": "Ik vertel hoe mensen in de oudheid in Egypte leefden: bij de Nijl, met piramides, en met een farao, priesters en boeren.", "checkvragen": ["Benoemt de piramides of de Nijl wanneer die getoond worden op een afbeelding.", "Herkent de farao als leider in een verhaal of activiteit over het oude Egypte.", "Speelt of benoemt een element van het oude Egypte na (bv. hiërogliefen, een piramide bouwen) tijdens een activiteit."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.1.3", "onderwerp": "Kennis van het verleden", "subthema": "Hedendaagse tijd", "doelzin": "De kleuters weten hoe mensen tijdens de hedendaagse tijd samenleefden. (ontwikkelingen: veranderingen in het straatbeeld, het interieur van een woning, technologie; plaatsen, personen en groepen:; ◦ eigen woning, eigen stad, dorp of straat; ◦ familieherinneringen uit de kindertijd).", "ikdoel": "Ik vertel over veranderingen die ik ken in mijn eigen straat, woning of familie, vroeger en nu.", "checkvragen": ["Vertelt over een familieherinnering of foto uit de kindertijd van een ouder of grootouder.", "Benoemt een verschil tussen \"vroeger\" en \"nu\" in de eigen straat, woning of dorp.", "Herkent op een oude foto iets dat er nu anders uitziet (bv. kledij, auto's, huizen)."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.2.1", "onderwerp": "Kennis van geschiedenis", "subthema": "Bronnengebruik", "doelzin": "De kleuters kunnen soorten bronnen vanuit de bestudeerde samenlevingen benoemen: beenderen, fossielen, werktuig, rotsschildering, graf; standbeeld, foto, dagboek, brief.", "ikdoel": "Ik benoem soorten bronnen uit het verleden: beenderen, fossielen, werktuigen, rotsschilderingen, graven, standbeelden, foto's, dagboeken, brieven.", "checkvragen": ["Benoemt een foto of brief als een bron uit het verleden.", "Wijst een werktuig, fossiel of beendert aan op een afbeelding en benoemt het als iets van vroeger.", "Herkent een standbeeld als iets dat aan het verleden herinnert."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.2.2", "onderwerp": "Kennis van geschiedenis", "subthema": "Historisch redeneren", "doelzin": "De kleuters kunnen enkele veranderingen tussen verleden en heden opnoemen.", "ikdoel": "Ik noem een verandering tussen vroeger en nu.", "checkvragen": ["Benoemt een verschil tussen een voorwerp van vroeger en nu (bv. telefoon, vervoer).", "Vertelt tijdens een kringgesprek iets dat vroeger anders was.", "Wijst op twee afbeeldingen (vroeger/nu) aan wat er veranderd is."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.2.3", "onderwerp": "Kennis van geschiedenis", "subthema": "Chronologisch bewustzijn", "doelzin": "De kleuters kennen de volgende begrippen: heel lang geleden, lang geleden, nu, later, oud, nieuw.", "ikdoel": "Ik gebruik en versta de woorden heel lang geleden, lang geleden, nu, later, oud en nieuw.", "checkvragen": ["Gebruikt \"lang geleden\" of \"nu\" correct in een zin tijdens een activiteit over het verleden.", "Wijst het oudste of nieuwste voorwerp aan uit een rij voorwerpen.", "Beantwoordt correct of iets \"oud\" of \"nieuw\" is wanneer het getoond wordt."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.2.4", "onderwerp": "Kennis van geschiedenis", "subthema": "Chronologisch bewustzijn", "doelzin": "De kleuters kunnen gebeurtenissen en eigen ervaringen chronologisch ordenen.", "ikdoel": "Ik orden gebeurtenissen of eigen ervaringen in de juiste volgorde.", "checkvragen": ["Legt drie foto's van een eigen ervaring (bv. een uitstap) in de juiste volgorde.", "Vertelt een verhaal over de eigen dag of week in de juiste volgorde.", "Herstelt de juiste volgorde wanneer twee gebeurtenissen omgewisseld worden voorgelegd."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.2.5", "onderwerp": "Kennis van geschiedenis", "subthema": "Chronologisch bewustzijn", "doelzin": "De kleuters kunnen drie gegeven bronnen uit het verleden chronologisch ordenen met behulp van de begrippen: heel lang geleden, lang geleden, nu.", "ikdoel": "Ik orden drie bronnen uit het verleden met de woorden heel lang geleden, lang geleden en nu.", "checkvragen": ["Legt drie aangeboden bronnen (bv. foto's of voorwerpen) in de juiste tijdsvolgorde.", "Benoemt bij het ordenen welke bron \"heel lang geleden\", welke \"lang geleden\" en welke \"nu\" hoort.", "Legt uit waarom een bron bij \"nu\" hoort en een andere bij \"heel lang geleden\"."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.3.1", "onderwerp": "Reflectie en dialoog over verleden en geschiedenis", "subthema": "Burgerschap", "doelzin": "De kleuters kennen de volgende begrippen: mening, overleg, stemmen.", "ikdoel": "Ik gebruik en versta de woorden mening, overleg en stemmen.", "checkvragen": ["Geeft een eigen mening tijdens een kringgesprek wanneer ernaar gevraagd wordt.", "Neemt deel aan een overleg of stemming in de klas (bv. welk spel spelen we).", "Benoemt het woord \"stemmen\" correct tijdens een klasactiviteit waarbij gestemd wordt."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.3.2", "onderwerp": "Reflectie en dialoog over verleden en geschiedenis", "subthema": "Erfgoed, identiteit, betekenis, relatie verleden-heden", "doelzin": "De kleuters weten waarom iets uit het verleden bewaard wordt.", "ikdoel": "Ik vertel waarom iets uit het verleden bewaard wordt.", "checkvragen": ["Geeft een reden waarom een oud voorwerp of foto bewaard wordt (bv. \"om het niet te vergeten\").", "Vertelt waarom een familiefoto of aandenken belangrijk is.", "Benoemt tijdens een museum- of erfgoedbezoek waarom iets daar bewaard wordt."]}, {"niveau": "kleuter", "vak": "Geschiedenis", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "5.3.3", "onderwerp": "Reflectie en dialoog over verleden en geschiedenis", "subthema": "Erfgoed, identiteit, betekenis, relatie verleden-heden", "doelzin": "De kleuters kunnen herkennen dat sporen uit het verleden aanwezig zijn in wat ze om zich heen zien.", "ikdoel": "Ik herken sporen uit het verleden in mijn omgeving.", "checkvragen": ["Wijst een oud gebouw, standbeeld of monument aan tijdens een wandeling.", "Benoemt dat iets in de buurt \"van vroeger\" is.", "Herkent een spoor uit het verleden op een foto van de eigen omgeving."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.1", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Grootmotorische en fysieke competenties", "doelzin": "De kleuters kunnen in bewegingscontexten motorische basisvaardigheden inzetten.", "ikdoel": "Ik zet motorische basisvaardigheden in tijdens bewegingsactiviteiten.", "checkvragen": ["Voert tijdens een bewegingsactiviteit spontaan een motorische basisvaardigheid uit (bv. lopen, springen, klimmen).", "Past een motorische vaardigheid toe binnen een spel- of bewegingscontext, niet enkel geïsoleerd.", "Toont vooruitgang in het gebruik van basisvaardigheden tijdens de turnles of buitenspel."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.2", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Grootmotorische en fysieke competenties", "doelzin": "De kleuters kunnen in bewegingscontexten eenvoudige (groot)motorische vaardigheden uitvoeren, waaronder heffen en dragen, klimmen en klauteren, rijden en glijden, sluipen en kruipen, springen en landen, stappen en lopen, werpen, vangen en trappen, zwieren, balanceren en roteren.", "ikdoel": "Ik voer eenvoudige bewegingen uit zoals heffen en dragen, klimmen en klauteren, rijden en glijden, sluipen en kruipen, springen en landen, stappen en lopen, werpen, vangen en trappen, zwieren, balanceren en roteren.", "checkvragen": ["Voert minstens drie van deze bewegingen correct uit tijdens een bewegingsactiviteit (bv. klimmen, springen, werpen).", "Kiest spontaan een van deze bewegingen tijdens vrij spel op de speelplaats of in de turnzaal.", "Voert een bewegingsopdracht met een van deze vaardigheden correct uit na instructie."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.3", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Grootmotorische en fysieke competenties", "doelzin": "De kleuters kunnen in bewegingscontexten de KLUSCE-componenten kracht, lenigheid, uithouding, snelheid, coördinatie en evenwicht inzetten.", "ikdoel": "Ik zet kracht, lenigheid, uithouding, snelheid, coördinatie en evenwicht in tijdens bewegingsactiviteiten.", "checkvragen": ["Toont evenwicht tijdens een balanceeroefening (bv. op een balk lopen).", "Toont kracht of snelheid tijdens een bewegingsspel (bv. duwen, sprinten).", "Toont coördinatie bij een oefening die twee bewegingen tegelijk vraagt (bv. springen en klappen)."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.4", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Grootmotorische en fysieke competenties", "doelzin": "De kleuters kunnen in verschillende bewegingscontexten spel- en bewegingsactiviteiten uitvoeren en met verschillende materialen.", "ikdoel": "Ik voer spel- en bewegingsactiviteiten uit met verschillende materialen.", "checkvragen": ["Gebruikt minstens één bewegingsmateriaal correct tijdens een activiteit (bv. bal, hoepel, mat).", "Neemt actief deel aan een spel- of bewegingsactiviteit met materiaal.", "Past het gebruik van een materiaal aan een nieuwe context of opdracht aan."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.5", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Psychomotoriek (lichaamsperceptie, tijdsperceptie en ruimteperceptie)", "doelzin": "De kleuters kennen hun voorkeurslichaamszijde.", "ikdoel": "Ik ken mijn voorkeurslichaamszijde.", "checkvragen": ["Gebruikt consequent dezelfde hand bij een activiteit die een handvoorkeur vraagt (bv. tekenen, gooien).", "Gebruikt consequent hetzelfde been bij een activiteit die een beenvoorkeur vraagt (bv. trappen tegen een bal).", "Benoemt of toont, wanneer ernaar gevraagd wordt, welke hand of voet de \"sterkste\" is."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.6", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Psychomotoriek (lichaamsperceptie, tijdsperceptie en ruimteperceptie)", "doelzin": "De kleuters kunnen in bewegingscontexten eenvoudige bewegingen afstemmen op tijd (duur, tempo, ritme, volgorde).", "ikdoel": "Ik stem eenvoudige bewegingen af op tijd: duur, tempo, ritme en volgorde.", "checkvragen": ["Beweegt mee op het ritme van muziek of een klankritme.", "Voert een korte bewegingsreeks uit in de juiste volgorde.", "Past het tempo van een beweging aan wanneer dat gevraagd wordt (bv. sneller of trager lopen)."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.7", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Psychomotoriek (lichaamsperceptie, tijdsperceptie en ruimteperceptie)", "doelzin": "De kleuters kunnen in bewegingscontexten eenvoudige bewegingen afstemmen op de ruimte (positie, afstand, richting, bewegingsbaan).", "ikdoel": "Ik stem eenvoudige bewegingen af op de ruimte: positie, afstand, richting en bewegingsbaan.", "checkvragen": ["Beweegt in de juiste richting wanneer dat aangegeven wordt (bv. naar voor, opzij).", "Houdt voldoende afstand tot een ander kind of voorwerp tijdens een bewegingsspel.", "Volgt een aangegeven bewegingsbaan (bv. een parcours of lijn) tijdens een activiteit."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.8", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Psychomotoriek (lichaamsperceptie, tijdsperceptie en ruimteperceptie)", "doelzin": "De kleuters kunnen in bewegingscontexten eenvoudige bewegingen afstemmen op zintuiglijke signalen (auditief, visueel, tactiel).", "ikdoel": "Ik stem mijn bewegingen af op een geluids-, zicht- of tastsignaal.", "checkvragen": ["Reageert met een beweging op een geluidssignaal (bv. stoppen bij een fluitje).", "Reageert met een beweging op een visueel signaal (bv. een kleur of gebaar).", "Reageert met een beweging op een tastsignaal (bv. een tikje of aanraking)."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.9", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Psychomotoriek (lichaamsperceptie, tijdsperceptie en ruimteperceptie)", "doelzin": "De kleuters kunnen in bewegingscontexten een linker- of rechtervoorkeur tonen bij éénhandige taken.", "ikdoel": "Ik toon een linker- of rechtervoorkeur bij taken die één hand vragen.", "checkvragen": ["Gebruikt consequent dezelfde hand bij een eenhandige taak (bv. een bal gooien).", "Kiest spontaan dezelfde hand telkens wanneer een eenhandige taak zich herhaalt.", "Toont een voorkeurshand tijdens een fijnmotorische of grofmotorische eenhandige activiteit."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.1.10", "onderwerp": "Motorische competenties en fysieke competenties", "subthema": "Psychomotoriek (lichaamsperceptie, tijdsperceptie en ruimteperceptie)", "doelzin": "De kleuters kunnen in bewegingscontexten waar tweehandigheid vereist is, een duidelijke taakverdeling tonen tussen het gebruik van de linker- en rechterhand.", "ikdoel": "Ik toon een duidelijke taakverdeling tussen mijn linker- en rechterhand bij taken die twee handen vragen.", "checkvragen": ["Gebruikt bij een tweehandige taak (bv. een bal met twee handen vangen) beide handen met een duidelijke taakverdeling (bv. één hand houdt vast, andere stuurt).", "Toont een consistente rolverdeling tussen de handen bij herhaling van dezelfde tweehandige taak.", "Voert een tweehandige activiteit (bv. knippen en vasthouden) vlot uit met een duidelijke rol per hand."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.2.1", "onderwerp": "Zelfconcept en interactie in groep", "subthema": null, "doelzin": "De kleuters kunnen binnen een eenvoudige spelvorm één tot twee spelregels opvolgen.", "ikdoel": "Ik volg één tot twee spelregels op binnen een eenvoudige spelvorm.", "checkvragen": ["Speelt een eenvoudig spel mee volgens de afgesproken regel(s).", "Stopt of past het eigen gedrag aan wanneer een regel overtreden wordt en herinnerd wordt.", "Legt op vraag een eenvoudige spelregel uit."]}, {"niveau": "kleuter", "vak": "Lichamelijke opvoeding", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "7.2.2", "onderwerp": "Zelfconcept en interactie in groep", "subthema": null, "doelzin": "De kleuters kunnen in hun bewegingsvaardigheid durf tonen.", "ikdoel": "Ik toon durf in mijn bewegingsvaardigheid.", "checkvragen": ["Probeert een nieuwe of uitdagende bewegingsopdracht uit (bv. van een hoger klimtoestel springen).", "Neemt deel aan een bewegingsactiviteit die net buiten de eigen comfortzone ligt, met aanmoediging.", "Toont zichtbaar plezier of trots na het aangaan van een bewegingsuitdaging."]}, {"niveau": "kleuter", "vak": "Muzische vorming", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "6.1.1", "onderwerp": "Domeinoverschrijdend", "subthema": "Vaardigheden en vormgevingsmiddelen", "doelzin": "De kleuters kunnen technieken/vaardigheden van de vijf muzische domeinen verkennen.", "ikdoel": "Ik verken technieken en vaardigheden van de vijf muzische domeinen (muziek, beeld, drama, dans, media).", "checkvragen": ["Probeert een techniek uit binnen minstens één muzisch domein tijdens een activiteit (bv. schilderen, zingen, verkleden).", "Neemt actief deel aan activiteiten uit verschillende muzische domeinen doorheen het jaar.", "Toont plezier of interesse bij het uitproberen van een nieuwe muzische techniek."]}, {"niveau": "kleuter", "vak": "Muzische vorming", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "6.1.2", "onderwerp": "Domeinoverschrijdend", "subthema": "Vaardigheden en vormgevingsmiddelen", "doelzin": "De kleuters kunnen vormgevingsmiddelen van de vijf muzische domeinen verkennen: muziek: de stem, het lied, de handtrom, de triangel, de tamboerijn, de fluit; beeld: het potlood, het penseel, de verf, de stempel, het tekenpapier; dr let S = { user:null, doelSel:null };

// ═══════════════════════════════════════════════════════════════════
// MSAL
// ═══════════════════════════════════════════════════════════════════
const msalApp = new msal.PublicClientApplication({
  auth:{ clientId:CONFIG.clientId, authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri:CONFIG.redirectUri },
  cache:{ cacheLocation:'localStorage', storeAuthStateInCookie:false },
});
const SCOPES=['User.Read'];

async function getToken(){
  if(window._portalToken) return window._portalToken;
  const accounts=msalApp.getAllAccounts();
  if(!accounts.length)return null;
  try{
    const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:accounts[0]});
    return r.accessToken;
  }catch(e){
    if(window.self !== window.top){
      showError('Sessie verlopen. Sluit dit venster en meld opnieuw aan via het portaal.');
      return null;
    }
    await msalApp.acquireTokenRedirect({scopes:SCOPES,account:accounts[0]});
    return null;
  }
}
async function login(){
  if(window.self !== window.top){
    showError('Sessie verlopen. Sluit dit venster en meld opnieuw aan via het portaal.');
    return;
  }
  try{ await msalApp.loginRedirect({scopes:SCOPES}); }
  catch(e){ showError('Aanmelden mislukt: '+e.message); }
}

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
async function boot(){
  try{
    await msalApp.initialize();
    await msalApp.handleRedirectPromise();
    const accounts=msalApp.getAllAccounts();
    if(!accounts.length){
      if(window.self !== window.top){
        showError('Geen actieve sessie gevonden. Meld aan via het portaal en open de app opnieuw.');
        return;
      }
      showView('login');
      return;
    }
    const token=await getToken();
    let naam = window._portalEmail || accounts[0].username || 'Leerkracht';
    if(token){
      try{
        const me=await fetch('https://graph.microsoft.com/v1.0/me',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
        naam = me.displayName || naam;
      }catch(e){ /* niet kritiek — naam-weergave enkel, app werkt zonder */ }
    }
    S.user = { naam };
    document.getElementById('topNaam').textContent = S.user.naam;
    initUI();
    showView('app');
  }catch(e){
    console.error(e);
    showError(e.message);
  }
}

function showView(v){
  ['Loading','Error','Login','App'].forEach(n=>document.getElementById('view'+n).style.display='none');
  document.getElementById('view'+(v.charAt(0).toUpperCase()+v.slice(1))).style.display=v==='app'?'flex':'';
}
function showError(msg){document.getElementById('errMsg').textContent=msg;showView('error');}
function notify(msg){const n=document.getElementById('notif');n.textContent=msg;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),2500);}

function initUI(){
  const selSchool=document.getElementById('selSchool');
  selSchool.innerHTML = CONFIG.scholen.map(s=>`<option>${s}</option>`).join('');
  onNiveauChange();
}
function onSchoolChange(){ renderCoverageNote(); }
function huidigNiveau(){ return document.getElementById('selNiveau').value; }
function onNiveauChange(){
  const niveau = huidigNiveau();
  const rows = WERKBOEK_DATA.filter(d=>d.niveau===niveau);
  const leerjaren = [...new Set(rows.map(d=>d.leerjaar))].sort((a,b)=>a-b);
  const selLj=document.getElementById('selLeerjaar');
  if(niveau==='kleuter'){
    selLj.innerHTML = `<option value="0">3e kleuterklas</option>`;
    selLj.disabled = true;
  } else {
    selLj.disabled = false;
    selLj.innerHTML = leerjaren.map(l=>`<option value="${l}">${l}e leerjaar</option>`).join('');
  }
  onLeerjaarChange();
}
function onLeerjaarChange(){
  const niveau = huidigNiveau();
  const lj = parseInt(document.getElementById('selLeerjaar').value);
  const vakken = [...new Set(WERKBOEK_DATA.filter(d=>d.niveau===niveau && d.leerjaar===lj).map(d=>d.vak))];
  const selVak=document.getElementById('selVak');
  const huidigeVak = selVak.value;
  selVak.innerHTML = vakken.map(v=>`<option${v===huidigeVak?' selected':''}>${v}</option>`).join('');
  onVakChange();
}
function onVakChange(){
  const niveau = huidigNiveau();
  const lj = parseInt(document.getElementById('selLeerjaar').value);
  const vak = document.getElementById('selVak').value;
  const onderwerpen = [...new Set(WERKBOEK_DATA.filter(d=>d.niveau===niveau && d.leerjaar===lj && d.vak===vak).map(d=>d.onderwerp))];
  const selOnd=document.getElementById('selOnderwerp');
  selOnd.innerHTML = onderwerpen.map(o=>`<option>${o}</option>`).join('');
  renderDoelLijst();
}
function renderDoelLijst(){
  const niveau = huidigNiveau();
  const lj = parseInt(document.getElementById('selLeerjaar').value);
  const vak = document.getElementById('selVak').value;
  const onderwerp = document.getElementById('selOnderwerp').value;
  const items = WERKBOEK_DATA.filter(d=>d.niveau===niveau && d.leerjaar===lj && d.vak===vak && d.onderwerp===onderwerp);
  document.getElementById('doelCount').textContent = items.length;
  const el=document.getElementById('doelLijst');
  if(!items.length){ el.innerHTML='<div class="empty-state">Geen doelen voor deze keuze.</div>'; return; }
  el.innerHTML = items.map((d,i)=>`
    <div class="doelitem" data-i="${i}" onclick="selecteerDoel(${i})">
      <div class="code">${d.doelcode} · ${d.subthema||''}</div>
      <div class="zin">${d.doelzin}</div>
    </div>`).join('');
  S._huidigeLijst = items;
  S.doelSel = null;
  document.getElementById('btnGenereer').disabled = true;
  document.getElementById('output').innerHTML = '';
  renderCoverageNote();
}
function selecteerDoel(i){
  S.doelSel = S._huidigeLijst[i];
  document.querySelectorAll('.doelitem').forEach(el=>el.classList.remove('sel'));
  document.querySelector(`.doelitem[data-i="${i}"]`).classList.add('sel');
  document.getElementById('btnGenereer').disabled = false;
}

function renderCoverageNote(){
  const niveau = huidigNiveau();
  const school = document.getElementById('selSchool').value;
  const lj = document.getElementById('selLeerjaar').value;
  const vak = document.getElementById('selVak').value;
  const el = document.getElementById('coverageNote');
  if(!vak){ el.innerHTML=''; return; }
  if(niveau==='kleuter'){
    el.innerHTML = `<div class="coverage-note ok"><i class="ti ti-info-circle"></i>
      <div>Voor kleuteronderwijs is er geen platformdekking geregistreerd (Bingel/Kabas/Scoodle worden pas vanaf het lager onderwijs gebruikt).</div></div>`;
    return;
  }
  const data = (PLATFORM_COVERAGE[school]||{})[lj] || {};
  const treffers = [];
  for(const [plat, vakken] of Object.entries(data)){
    for(const v of vakken){
      if(v.toLowerCase().includes(vak.toLowerCase()) || vak.toLowerCase().includes('de wereld en ik') && v.toLowerCase().includes('wereld')){
        treffers.push(`${plat} (${v})`);
      }
    }
  }
  if(treffers.length){
    el.innerHTML = `<div class="coverage-note"><i class="ti ti-info-circle"></i>
      <div><b>${vak}</b> loopt voor ${school}, ${lj}e leerjaar al gedeeltelijk via: ${treffers.join(', ')}. Overweeg aanvullend materiaal (verrijking, klasgesprek, evaluatie) in plaats van dubbel werk.</div></div>`;
  } else {
    el.innerHTML = `<div class="coverage-note ok"><i class="ti ti-circle-check"></i>
      <div><b>${vak}</b> wordt voor ${school}, ${lj}e leerjaar niet via een digitaal oefenplatform gedekt — vrij baan voor eigen materiaal.</div></div>`;
  }
}

// ═══════════════════════════════════════════════════════════════════
// PROMPT GENERATIE
// ═══════════════════════════════════════════════════════════════════
const MATERIAAL_LABEL = {
  lesmateriaal:'lesmateriaal (korte lesopzet)', werkblad:'werkblad', toets:'toets',
  verdieping:'verdiepingsopdracht', remediering:'remediëringsoefening',
};
const MATERIAAL_CANVA_HINT = {
  lesmateriaal:'Ontwerp een instructieposter of introductieslide voor bij de les.',
  werkblad:'Maak een werkblad met invulvakken en/of tekenvakken.',
  toets:'Maak een overzichtelijke toetslayout met genummerde vragen en voldoende antwoordruimte.',
  verdieping:'Ontwerp een uitdagende extra-opdrachtkaart voor leerlingen die dit doel al beheersen.',
  remediering:'Ontwerp een ondersteunend oefenblad met extra visuele hulp en kleinere stappen.',
};
const MATERIAAL_TEKST_HINT = {
  lesmateriaal:'Bouw een korte lesopzet op met een korte uitleg, een klassikale activiteit en een individuele opdracht.',
  werkblad:'Stel een werkblad samen met 4 tot 6 opdrachten van oplopende moeilijkheidsgraad.',
  toets:'Stel een toets samen met een mix van open en gesloten vragen.',
  verdieping:'Maak een verdiepingsopdracht voor leerlingen die dit doel al beheersen — net iets uitdagender dan de basisstof.',
  remediering:'Maak een remediëringsoefening met extra tussenstappen en visuele ondersteuning voor leerlingen die dit doel nog niet beheersen.',
};

function genereerPrompts(){
  const d = S.doelSel;
  if(!d) return;
  const mat = document.getElementById('selMateriaal').value;
  const matLabel = MATERIAAL_LABEL[mat];
  const ljLabel = d.leerjaarLabel;
  const niveauLabel = d.niveau==='kleuter' ? 'kleuteronderwijs' : 'lager onderwijs';
  const checkvragen = (d.checkvragen||[]).map(q=>'- '+q).join('\n');

  const canvaPrompt = `Maak in Canva Magic Studio een ${matLabel} voor ${ljLabel} (${niveauLabel}).

Vak: ${d.vak} — ${d.onderwerp}${d.subthema?' ('+d.subthema+')':''}
Doel: "${d.doelzin}"

Ontwerp:
- Formaat: A4, geschikt om af te drukken
- Stijl: kleurrijk en speels, passend bij kinderen van ${ljLabel}
- Voeg illustraties of iconen toe die aansluiten bij "${d.onderwerp}"
- Zorg voor voldoende witruimte en een duidelijke, leesbare opmaak
- ${MATERIAAL_CANVA_HINT[mat]}`;

  const tekstPrompt = `Je bent een ervaren leerkracht ${niveauLabel} in Vlaanderen. Maak een ${matLabel} voor leerlingen van ${ljLabel}.

Vak: ${d.vak} — ${d.onderwerp}${d.subthema?' ('+d.subthema+')':''}
Doel (officieel): "${d.doelzin}"
Doel (kindtaal): "${d.ikdoel||d.doelzin}"
${checkvragen ? '\nMogelijke reflectievragen om in te verwerken:\n'+checkvragen+'\n' : ''}
${MATERIAAL_TEKST_HINT[mat]}

Schrijf in het Nederlands, aangepast aan het niveau van ${ljLabel}. Gebruik een duidelijke opbouw met kopjes.`;

  document.getElementById('output').innerHTML = `
    <div class="promptcard">
      <div class="ph canva-h"><h3><i class="ti ti-palette"></i>Canva Magic Studio</h3></div>
      <div class="pb">
        <textarea id="promptCanva" readonly>${canvaPrompt}</textarea>
        <div class="pf">
          <button class="btn" onclick="kopieer('promptCanva')"><i class="ti ti-copy"></i>Kopiëren</button>
          <a class="btn p" href="https://www.canva.com/" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Open Canva</a>
        </div>
      </div>
    </div>
    <div class="promptcard">
      <div class="ph ai-h"><h3><i class="ti ti-message-chatbot"></i>Copilot</h3></div>
      <div class="pb">
        <textarea id="promptTekst" readonly>${tekstPrompt}</textarea>
        <div class="pf">
          <button class="btn" onclick="kopieer('promptTekst')"><i class="ti ti-copy"></i>Kopiëren</button>
          <a class="btn p" href="https://copilot.microsoft.com/" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Open Copilot</a>
        </div>
      </div>
    </div>`;
  document.getElementById('output').scrollIntoView({behavior:'smooth', block:'start'});
}

function kopieer(id){
  const el=document.getElementById(id);
  el.select();
  navigator.clipboard.writeText(el.value).then(()=>notify('Gekopieerd ✓')).catch(()=>{
    document.execCommand('copy'); notify('Gekopieerd ✓');
  });
}
</script>
</body>
</html>
