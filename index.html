<style>
:root{--a:#1B4E9E;--al:#E8EEF7;--at:#12356E;--ab:#C3D4EC}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F8F7F4;color:#1A1A18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1.5rem;padding:2rem}
.splash-logo{width:72px;height:72px;background:var(--a);border-radius:18px;display:flex;align-items:center;justify-content:center}
.splash-logo i{font-size:38px;color:white}
.splash h1{font-size:22px;font-weight:700;text-align:center}
.splash p{font-size:14px;color:#888;text-align:center;max-width:360px}
.spin{width:28px;height:28px;border:3px solid #E0DDD5;border-top-color:var(--a);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app-shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--a);color:white;padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
.topbar-l{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:15px;font-weight:700}
.topbar p{font-size:11px;opacity:.8;margin-top:1px}
.user-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;font-size:12px}
.content{flex:1;max-width:780px;margin:0 auto;width:100%;padding:1.25rem 1rem}
.card{background:white;border:1px solid #E8E5DC;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.ct{font-size:14px;font-weight:600;color:#333;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.ct i{color:var(--a);font-size:18px}
.field{margin-bottom:.9rem}.field:last-child{margin-bottom:0}
label{display:block;font-size:11px;font-weight:700;color:#777;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
select,textarea{width:100%;padding:9px 12px;border:1px solid #DDD;border-radius:8px;font-size:14px;background:white;color:#1A1A18;font-family:inherit}
select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.fr,.fr3{grid-template-columns:1fr}}
.doellijst{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.doelitem{border:1.5px solid #E0DDD5;border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .12s}
.doelitem:hover{border-color:var(--a);background:var(--al)}
.doelitem.sel{border-color:var(--a);background:var(--al)}
.doelitem .code{font-size:10px;font-weight:700;color:var(--at);text-transform:uppercase;letter-spacing:.04em}
.doelitem .zin{font-size:13px;color:#333;margin-top:2px;line-height:1.45}
.btn{padding:10px 18px;border:1px solid #DDD;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;background:white;color:#333;display:inline-flex;align-items:center;gap:7px;font-weight:500}
.btn:hover{background:#F5F5F0}
.btn.p{background:var(--a);border-color:var(--a);color:white}
.btn.p:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%;justify-content:center;padding:12px}
.promptcard{border:1px solid #E8E5DC;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.promptcard .ph{padding:.85rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:10px;color:white}
.promptcard .ph h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.promptcard .pb{padding:1rem 1.1rem}
.promptcard textarea{min-height:220px;font-size:12.5px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;background:#FBFAF7}
.promptcard .pf{display:flex;gap:8px;justify-content:flex-end;margin-top:.75rem;flex-wrap:wrap}
.canva-h{background:#8B3DFF}
.ai-h{background:var(--a)}
.coverage-note{display:flex;gap:10px;align-items:flex-start;background:#FEF3E8;border:1px solid #FDDCB5;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#7A3200;margin-top:.5rem}
.coverage-note.ok{background:var(--al);border-color:var(--ab);color:var(--at)}
.coverage-note i{font-size:16px;flex-shrink:0;margin-top:1px}
.empty-state{text-align:center;padding:28px;color:#AAA;font-size:13px}
.notif{position:fixed;bottom:24px;right:24px;background:var(--a);color:white;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.notif.on{opacity:1}
.badge-count{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
.page{display:none}.page.active{display:block}
body.in-portal .icon-btn[title="Help"]{display:none !important}
</style>

<script>
window._portalToken = null;
window._portalEmail = '';
window._appBooted = false;
document.addEventListener('DOMContentLoaded', function() {
  window.addEventListener('message', function(event) {
    if (event.origin !== 'https://lon-ka.github.io') return;
    if (!event.data) return;
    if (event.data.type !== 'MSAL_TOKEN') return;
    if (window._portalToken) return;
    window._portalToken = event.data.token;
    document.body.classList.add('in-portal');
    window._portalEmail = event.data.email || '';
    if (!window._appBooted && typeof boot==='function') boot();
  });
});

laties tussen bewerkingen", "doelzin": "De leerlingen kennen het delen als: verdelingsdeling, verhoudingsdeling, opgaande en niet-opgaande deling [I]. (< bv. ◦ verdelingsdeling: ik heb 8 knikkers, ik verdeel ze over twee vrienden, hoeveel elk?; ◦ verhoudingsdeling: ik heb 8 knikkers, ik maak zakjes van 2 knikkers, hoeveel zakjes? >).", "ikdoel": "Ik ken het delen als verdelingsdeling, verhoudingsdeling, opgaande en niet-opgaande deling.", "checkvragen": ["Geef een voorbeeld van een verdelingsdeling.", "Geef een voorbeeld van een verhoudingsdeling.", "Wat is het verschil tussen een opgaande en een niet-opgaande deling?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.2.4", "onderwerp": "Bewerkingen", "subthema": "Overkoepelend deel: begripsvorming, eigenschappen van en relaties tussen bewerkingen", "doelzin": "De leerlingen kennen het verband tussen verhoudingsdeling en verdelingsdeling [I]. (< bv. 6 : 2 = 3: ik deel 6 knikkers uit aan twee leerlingen en kijk hoeveel ieder er krijgt (=3), ik kan ook tellen hoe vaak ik 2 knikkers kan uitdelen (=3) >).", "ikdoel": "Ik ken het verband tussen verhoudingsdeling en verdelingsdeling.", "checkvragen": ["Leg met een voorbeeld uit dat 6 : 2 = 3 zowel als verdelingsdeling als als verhoudingsdeling geïnterpreteerd kan worden.", "Wat blijft gelijk, en wat verschilt, tussen deze twee interpretaties van dezelfde deling?", "Waarom is het nuttig om beide interpretaties van een deling te kennen?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.2.5", "onderwerp": "Bewerkingen", "subthema": "Overkoepelend deel: begripsvorming, eigenschappen van en relaties tussen bewerkingen", "doelzin": "De leerlingen kennen het gelijkheidsteken als aanduiding voor een wiskundige gelijkheid [I]. (< het gelijkheidsteken wordt vaak uitsluitend als signaal gezien om iets uit te rekenen, terwijl het slaat op een gelijkheid tussen beide zijden van ennen een schematische voorstelling voor de oplossingsstrategie van optellen/aftrekken met breuken [I].", "ikdoel": "Ik ken een schematische voorstelling voor de oplossingsstrategie van optellen/aftrekken met breuken.", "checkvragen": ["Hoe kan je een schema gebruiken om breuken op te tellen?", "Waarom helpt een schematische voorstelling om breuken correct op te tellen of af te trekken?", "Wat toon je in zo'n schema?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.2.24", "onderwerp": "Bewerkingen", "subthema": "Bewerkingen met breuken en procenten", "doelzin": "De leerlingen kunnen bij breuken waarbij de noemer beperkt is tot en met 20: gelijknamige breuken optellen en aftrekken; een breuk van een getal nemen.", "ikdoel": "Ik tel gelijknamige breuken op en trek ze af, en neem een breuk van een getal, bij breuken met een noemer tot en met 20.", "checkvragen": ["Wat is 2/5 + 1/5?", "Wat is 3/8 - 1/8?", "Wat is 1/4 van 20?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.2.25", "onderwerp": "Bewerkingen", "subthema": "Andere rekenwijzen: schattend rekenen, cijferen, rekenen met digitale rekentool", "doelzin": "De leerlingen kennen procedures om te cijferen voor optellen en aftrekken op basis van inzicht in de tientalligheid en het plaatswaardesysteem van ons talstelsel [I].", "ikdoel": "Ik ken procedures om te cijferen bij optellen en aftrekken, op basis van inzicht in de tientalligheid en het plaatswaardesysteem.", "checkvragen": ["Wat betekent \"cijferen\" bij een optelling?", "Waarom moet je bij het cijferen rekening houden met de tientalligheid?", "Wat gebeurt er als je bij een cijferaftrekking moet \"lenen\"?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.2.26", "onderwerp": "Bewerkingen", "subthema": "Andere rekenwijzen: schattend rekenen, cijferen, rekenen met digitale rekentool", "doelzin": "D l": "Ik ken de noodzaak van standaardmaten om metingen eenduidig uit te voeren en te vergelijken.", "checkvragen": ["Wat zou er misgaan als iedereen zijn eigen maateenheid gebruikte?", "Waarom zijn standaardmaten wereldwijd afgesproken?", "Geef een voorbeeld van een probleem dat je zou hebben zonder standaardmaten."]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.3.3", "onderwerp": "Meten en metend rekenen", "subthema": "Overkoepelende meetinzichten en vaardigheden", "doelzin": "De leerlingen kennen de volgende begrippen [F]: de maateenheid, het maatgetal, de maat (= maatgetal + maateenheid).", "ikdoel": "Ik ken de begrippen maateenheid, maatgetal en maat (= maatgetal + maateenheid).", "checkvragen": ["Wat is het maatgetal in \"5 meter\"?", "Wat is de maateenheid in \"5 meter\"?", "Wat is een \"maat\"?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.3.4", "onderwerp": "Meten en metend rekenen", "subthema": "Overkoepelende meetinzichten en vaardigheden", "doelzin": "De leerlingen kunnen meten en metend rekenen voor lengte, oppervlakte en inhoud, massa, geld, tijdstip en tijdsduur, temperatuur (zie verder) met inbegrip van: het zinvol afronden van het resultaat; het ordenen van meetresultaten (seriëren).", "ikdoel": "Ik meet en reken metend voor lengte, oppervlakte, inhoud, massa, geld, tijdstip, tijdsduur en temperatuur, met inbegrip van zinvol afronden en het ordenen van meetresultaten.", "checkvragen": ["Wat betekent \"zinvol afronden\" van een meetresultaat?", "Waarom orden je soms meetresultaten (seriëren)?", "Geef een voorbeeld van een grootheid die je metend berekent."]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "2.3.5", "onderwerp": "Meten en metend rekenen", "subthema": "Overkoepelende meetinzichten en vaardigheden", "doelzin": "De leerlingen kunnen een verhoudingstabel gebruiken voor bereken n natuurlijk getal via de keerhandeling, en delen door een natuurlijk getal via de verdelingsdeling.", "checkvragen": ["Reken 0,6 x 3 uit via de keerhandeling.", "Reken 0,08 : 2 uit via de verdelingsdeling.", "Hoe tel je 2,345 en 1,67 op met aandacht voor de plaatswaarde?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "2.2.8", "onderwerp": "Bewerkingen", "subthema": "Hoofdrekenen: handig rekenen", "doelzin": "De leerling kent een werkwijze voor vermenigvuldigen met en delen door 0,1; 0,01; 0,001; 0,2; 0,5; 2; 5; 25; 50 [I].", "ikdoel": "Ik ken een werkwijze voor vermenigvuldigen met en delen door 0,1, 0,01, 0,001, 0,2, 0,5, 2, 5, 25 en 50.", "checkvragen": ["Wat gebeurt er als je een getal met 0,1 vermenigvuldigt?", "Hoe reken je snel iets keer 0,5 uit?", "Hoe reken je snel iets gedeeld door 25 uit?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "2.2.9", "onderwerp": "Bewerkingen", "subthema": "Hoofdrekenen: handig rekenen", "doelzin": "De leerling kent een werkwijze voor vermenigvuldigen met en delen door 10 000, 4, 8 [I].", "ikdoel": "Ik ken een werkwijze voor vermenigvuldigen met en delen door 10 000, 4 en 8.", "checkvragen": ["Hoe reken je snel iets keer 4 uit (denk aan verdubbelen)?", "Hoe reken je snel iets gedeeld door 8 uit?", "Wat gebeurt er als je een getal met 10 000 vermenigvuldigt?"]}, {"niveau": "lager", "vak": "Wiskunde", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "2.2.10", "onderwerp": "Bewerkingen", "subthema": "Hoofdrekenen: handig rekenen", "doelzin": "De leerling kan eigenschappen van bewerkingen en relaties gebruiken om handig te rekenen. (< bv. 31 + 19 = (31 – 1) + (19 + 1) = 30 + 20; 73 – 19 = (73 + 1) – (19 + 1) = 74 – 20; 12 x 5 = (12 : 2) x (5 x 2) = 6 x 10; 48 : 12 = (48 : 2) : (12 : 2) = 24 : 6; 98 x 12 = (100 – 2) x 12 = (100 x 12) – (2 x 12) = 1 200 – 24 (compenseren, splitsen en verdelen); 2 277 : 23 = (2 300 – en en vraagstukken", "subthema": "Vraagstukken", "doelzin": "De leerling kan met natuurlijke getallen tot en met 10 000 (of grotere getallen met eindnullen), decimale getallen (tot op 1 duizendste) en breuken (noemers tot en met 100): (samengestelde) vraagstukken oplossen over: breuken en procenten met:; ◦ een breuk als operator of deel/geheel; ◦ groeipercentages; < bv. een bevolkingstoename >; ◦ absolute en relatieve vergelijkingen (met verhoudingstabel, een breuk of een procent).; ​​​​​​​< bv. in de Vlinderschool (100 lln.) fietst 48%, in de Parkschool (2000 lln.) een vijfde. Relatief meer fietsers in de Vlinderschool, absoluut meer in de Parkschool. >; delers, veelvouden en restbepaling; de bewerkingen (+, -, x, :) met (samengestelde vraagstukken):; ◦ natuurlijke getallen; ◦ decimale getallen, breuken, procenten.; ongelijke verdeling waarbij:; ◦ de som en het verschil gegeven zijn; ◦ de som en de verhouding van de delen gegeven zijn.; mengsels; verhoudingen met behulp van een verhoudingstabel (waaronder de regel-van-drie) waarbij:; ◦ gelijkwaardige verhoudingen bepaald worden; ◦ het ontbrekende verhoudingsgetal berekend wordt; ◦ recht, omgekeerd en niet-evenredige grootheden een rol spelen.; < bv. aantal-prijs, afstand-prijs, afstand-tijd, massa-prijs, aantal dieren-hoeveelheid voedsel, debiet-tijd, tijd-snelheid >; één grootheid: lengte, oppervlakte, inhoud, volume, massa, tijd, geld, temperatuur, hoekgrootte; relaties tussen grootheden (zonder en met procenten):; ◦ prijsberekeningen: winst/verlies, korting, prijsstijging, enkelvoudige interest; ◦ bruto/tarra/netto; ◦ afstand, snelheid en tijd; ◦ schaal, lengte op schaal en werkelijke lengte.; meetkundige figuren waarbij de eigenschappen gebruikt worden; statistiek met tabellen, grafieken, diagrammen, gemiddelde en mediaan.", "ikdoel": "Ik los (samengestelde) vraagstukken op met natuurlijke getallen tot en met 10 000 (of grotere getallen met eindnullen), decimale getallen (tot op 1 duizendste) en breuken (noemer bthema": "Inzicht in digitale systemen", "doelzin": "De leerlingen kennen het proces van digitale informatieverwerking en begrijpen hoe digitale systemen met elkaar verbonden kunnen worden om te communiceren: samenhang tussen invoer, verwerking, uitvoer en opslag; gegevensuitwisseling tussen digitale systemen; verbinding tussen systemen; < bv. via kabel, wifi of mobiel internet >; verwerking en opslag van gegevens op een andere locatie dan het eigen digitale apparaat.; < bv. ◦ Leerlingen begrijpen dat een tablet een bericht verwerkt: je typt iets (invoer), het toestel verwerkt dit en toont het bericht op het scherm (uitvoer).; ◦ Leerlingen begrijpen dat bij online gamen meerdere spelers tegelijk in verbinding staan via het internet, zodat ze samen kunnen spelen en communiceren (realtime gegevensuitwisseling). >.", "ikdoel": "Ik ken het proces van digitale informatieverwerking en begrijp hoe digitale systemen met elkaar verbonden zijn om te communiceren: de samenhang tussen invoer, verwerking, uitvoer en opslag, gegevensuitwisseling en verbinding (bv. via kabel, wifi of mobiel internet), en dat gegevens ook op een andere locatie dan het eigen toestel verwerkt of opgeslagen kunnen worden.", "checkvragen": ["Leg met een voorbeeld uit hoe invoer, verwerking en uitvoer samenhangen bij een tablet of computer.", "Op welke manieren kunnen twee digitale toestellen met elkaar verbinden?", "Wat betekent het dat gegevens \"in de cloud\" of op een andere locatie verwerkt worden?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.1.2", "onderwerp": "Computationeel denken", "subthema": "Inzicht in digitale systemen", "doelzin": "De leerlingen kennen de volgende begrippen: de invoer, de uitvoer, de opslag, de informatieverwerking, het netwerk, de verbinding.", "ikdoel": "Ik ken de begrippen invoer, uitvoer, opslag, informatieverwerking, netwerk en verbinding.", "checkvragen": ["Wat is een netwerk?", "Wat is het verschil tussen opslag en informatieverwerking?", "Geef een voorbeeld van een verbinding tussen twee digitale systemen."]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.1.3", "onderwerp": "Computationeel denken", "subthema": "Principes van computationeel denken", "doelzin": "De leerlingen kunnen onder begeleiding de principes van computationeel denken toepassen om een algoritme te ontwerpen, testen en debuggen om tot een werkende oplossing te komen: opbouw van algoritme: combinatie van sequentie, herhaling, keuze.", "ikdoel": "Ik kan onder begeleiding een algoritme ontwerpen, testen en verbeteren waarin sequentie, herhaling en keuze gecombineerd worden.", "checkvragen": ["Wat is het verschil tussen sequentie en herhaling in een algoritme?", "Wat is een \"keuze\" (bv. als/dan) in een algoritme? Geef een voorbeeld.", "Waarom kan het combineren van sequentie, herhaling en keuze een algoritme krachtiger maken dan enkel sequentie?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.1", "onderwerp": "Digitale informatievaardigheid", "subthema": "Digitale geletterdheid", "doelzin": "De leerlingen kunnen doelgericht invoer- en uitvoerapparaten gebruiken en instellen met inbegrip van vlot gebruik van een toetsenbord.", "ikdoel": "Ik kan invoer- en uitvoerapparaten doelgericht gebruiken en instellen, met inbegrip van vlot gebruik van een toetsenbord.", "checkvragen": ["Noem een instelling die je kan aanpassen aan een invoer- of uitvoerapparaat.", "Wat betekent \"vlot\" toetsenbordgebruik: waar let je op?", "Waarom is het nuttig om apparaten aan je eigen noden te kunnen instellen?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.2", "onderwerp": "Digitale informatievaardigheid", "subthema": "Digitale geletterdheid", "doelzin": "De leerlingen kunnen bestanden openen, downloaden, opslaan, uploaden en sluiten.", "ikdoel": "Ik kan bestanden openen, downloaden, opslaan, uploaden en sluiten.", "checkvragen": ["Wat is het verschil tussen downloaden en uploaden?", "Waarom is het belangrijk om een bestand op te slaan voor je het sluit?", "Noem de stappen om een bestand te openen, aan te passen en opnieuw op te slaan."]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.3", "onderwerp": "Digitale informatievaardigheid", "subthema": "Digitale geletterdheid", "doelzin": "De leerlingen kunnen bestanden beheren via een aangereikte structuur. (< bv.; ◦ duidelijke bestandsnamen gebruiken; ◦ bestanden opslaan in de juiste map; ◦ verwijderen van overbodige of foute bestanden; ◦ aanmaken van mappen; ◦ hernoemen van mappen en bestanden; ◦ terughalen van verwijderde bestanden >).", "ikdoel": "Ik kan bestanden beheren via een aangereikte structuur: duidelijke bestandsnamen gebruiken, bestanden in de juiste map opslaan, overbodige bestanden verwijderen, mappen aanmaken en hernoemen, en verwijderde bestanden terughalen.", "checkvragen": ["Waarom is een duidelijke bestandsnaam belangrijk?", "Hoe kan je een per ongeluk verwijderd bestand terughalen?", "Wat doe je als je een map wil hernoemen?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.4", "onderwerp": "Digitale informatievaardigheid", "subthema": "Digitale geletterdheid", "doelzin": "De leerlingen kunnen eenvoudige systeeminstellingen aanpassen. (< bv.; ◦ taalinstellingen aanpassen; ◦ wifi aan/uit zetten; ◦ weergave-instellingen aanpassen >).", "ikdoel": "Ik kan eenvoudige systeeminstellingen aanpassen, zoals taalinstellingen, wifi aan/uit zetten en weergave-instellingen.", "checkvragen": ["Hoe zet je wifi aan of uit op een toestel?", "Welke systeeminstelling zou je aanpassen om de taal van een toestel te wijzigen?", "Noem een voorbeeld van een weergave-instelling die je kan aanpassen."]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.5", "onderwerp": "Digitale informatievaardigheid", "subthema": "Informatiegeletterdheid", "doelzin": "De leerlingen kennen het volgende begrip: de artificiële intelligentie.", "ikdoel": "Ik ken het begrip artificiële intelligentie.", "checkvragen": ["Wat is artificiële intelligentie?", "Noem een toepassing waarin je artificiële intelligentie herkent.", "Wat is het verschil tussen een gewoon computerprogramma en een AI-toepassing, denk je?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.6", "onderwerp": "Digitale informatievaardigheid", "subthema": "Informatiegeletterdheid", "doelzin": "De leerlingen kunnen een zoekstrategie uitwerken, toepassen en indien nodig bijsturen vanuit de principes van computationeel denken. (< bv. een eenvoudige en effectieve prompt formuleren in een door de school beschikbaar gestelde AI-tool om content/informatie te verkrijgen >).", "ikdoel": "Ik kan een zoekstrategie uitwerken, toepassen en indien nodig bijsturen vanuit de principes van computationeel denken, bijvoorbeeld door een eenvoudige en effectieve prompt te formuleren in een AI-tool die de school aanbiedt.", "checkvragen": ["Wat maakt een prompt aan een AI-tool \"effectief\"?", "Wat doe je als een AI-tool niet het gewenste antwoord geeft?", "Hoe verschilt het zoeken met een AI-tool van zoeken met een klassieke zoekmachine?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.7", "onderwerp": "Digitale informatievaardigheid", "subthema": "Informatiegeletterdheid", "doelzin": "De leerlingen kunnen aan de hand van aangereikte criteria digitale bronnen beoordelen op bruikbaarheid, betrouwbaarheid en correctheid.", "ikdoel": "Ik kan digitale bronnen beoordelen op bruikbaarheid, betrouwbaarheid en correctheid, aan de hand van aangereikte criteria.", "checkvragen": ["Wat is het verschil tussen een betrouwbare en een onbetrouwbare digitale bron?", "Noem een criterium waarmee je kan nagaan of informatie correct is.", "Waarom is bruikbaarheid niet hetzelfde als betrouwbaarheid van een bron?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.2.8", "onderwerp": "Digitale informatievaardigheid", "subthema": "Informatiegeletterdheid", "doelzin": "De leerlingen kunnen voorbeelden geven van toepassingen waarin AI gebruikt wordt. (< bv. spraakherkenning, vertaaltools, aanbevelingssysteem >).", "ikdoel": "Ik kan voorbeelden geven van toepassingen waarin AI gebruikt wordt, zoals spraakherkenning, vertaaltools en aanbevelingssystemen.", "checkvragen": ["Noem drie toepassingen waarin AI gebruikt wordt.", "Wat doet een aanbevelingssysteem?", "Hoe herken je dat een app spraakherkenning gebruikt?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.3.1", "onderwerp": "Mediawijsheid", "subthema": null, "doelzin": "De leerlingen kennen de volgende begrippen: het auteursrecht, het portretrecht, de online veiligheid, het nepnieuws. (< ◦ auteursrecht: bescherming van eigen creaties; ◦ portretrecht: recht op afbeelding; ◦ online veiligheid: verantwoord gedrag om jezelf en anderen te beschermen op het internet; ◦ nepnieuws: informatie die bewust fout of verzonnen is om mensen te misleiden >).", "ikdoel": "Ik ken de begrippen auteursrecht, portretrecht, online veiligheid en nepnieuws.", "checkvragen": ["Wat is auteursrecht?", "Wat is portretrecht?", "Wat is nepnieuws, en waarom is het misleidend?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.3.2", "onderwerp": "Mediawijsheid", "subthema": null, "doelzin": "De leerlingen kennen basisprincipes van auteursrecht en portretrecht: wat iemand zelf maakt, zoals een tekst, foto of video, mag niet zomaar door anderen gebruikt of gekopieerd worden; iemand mag niet gefotografeerd of gefilmd worden zonder goedkeuring van die persoon; een foto of video waarop iemand herkenbaar afgebeeld staat mag enkel gepubliceerd of gedeeld worden als die persoon toestemming geeft.", "ikdoel": "Ik ken basisprincipes van auteursrecht en portretrecht: een eigen gemaakte tekst, foto of video mag niet zomaar door anderen gebruikt worden, iemand mag niet gefotografeerd of gefilmd worden zonder toestemming, en een herkenbare foto of video mag alleen gepubliceerd worden met toestemming van die persoon.", "checkvragen": ["Mag je zomaar een foto van een klasgenoot online zetten? Waarom (niet)?", "Mag je een tekst of tekening van iemand anders zonder toestemming overnemen? Waarom (niet)?", "Wat moet er gebeuren voor je een video waarop een vriend herkenbaar staat mag delen?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.3.3", "onderwerp": "Mediawijsheid", "subthema": null, "doelzin": "De leerlingen kennen mogelijkheden om zichzelf en anderen online te beschermen. (< bv. ◦ een sterk wachtwoord kiezen; ◦ weten met wie je omgaat; ◦ weten bij wie je terechtkunt voor hulp >).", "ikdoel": "Ik ken mogelijkheden om mezelf en anderen online te beschermen: een sterk wachtwoord kiezen, weten met wie ik online omga, en weten bij wie ik terechtkan voor hulp.", "checkvragen": ["Wat maakt een wachtwoord sterk?", "Waarom is het belangrijk om te weten met wie je online contact hebt?", "Bij wie kan jij terecht als je iets vervelends meemaakt online?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.3.4", "onderwerp": "Mediawijsheid", "subthema": null, "doelzin": "De leerlingen kunnen de impact van digitale media op hun eigen leefwereld, fysieke en morele integriteit en die van anderen illustreren waaronder: ethische aspecten; sociale aspecten; regelgevende aspecten; gezondheidsaspecten; veiligheidsaspecten.; < bv. ◦ berichten of screenshots bekijken en herkennen wanneer iemand wordt buitengesloten, gepest of gekwetst; ◦ herkennen hoe bedrijven leerlingen proberen te beïnvloeden via online reclame, spelletjes of influencers; ◦ situaties herkennen waarin veel schermtijd leidt tot vermoeidheid of afleiding; ◦ cookies herkennen als het gevolg van de privacywet >.", "ikdoel": "Ik kan de impact van digitale media op mijn leefwereld en integriteit illustreren: ethische aspecten (bv. buitensluiten of pesten online), sociale aspecten (bv. beïnvloeding via reclame of influencers), gezondheidsaspecten (bv. vermoeidheid door schermtijd) en regelgevende/veiligheidsaspecten (bv. cookies en privacywetgeving).", "checkvragen": ["Geef een voorbeeld van hoe iemand online buitengesloten of gepest kan worden.", "Hoe proberen bedrijven jou online te beïnvloeden?", "Wat kan te veel schermtijd met je doen, en wat zijn cookies?"]}, {"niveau": "lager", "vak": "ICT", "leerjaar": 6, "leerjaarLabel": "6e leerjaar", "doelcode": "8.4.1", "onderwerp": "Digitale creatie", "subthema": "Communiceren", "doelzin": "De leerlingen kennen mogelijkheden van digitale tools om te communiceren. (< bv. berichten, e-mail, chat, reacties of videogesprekken >).", "ikdoel": "Ik ken mogelijkheden van digitale tools om te communiceren: berichten, e-mail, chat, reacties en videogesprekken.", "checkvragen": ["Noem drie manieren om digitaal met iemand te communiceren.", "Wat is het verschil tussen een chatbericht en een e-mail?", "Wanneer zou je een videogesprek gebruiken in plaats van een bericht te sturen?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.1.1", "onderwerp": "Topografie", "subthema": "Topografisch referentiekader", "doelzin": "De leerlingen kennen de naam en de ligging van: de schoolgemeente en eventuele deelgemeenten, en buurgemeenten; de eigen regio; de Belgische provincies met hun hoofdplaatsen; de buurlanden van België; de gewesten en gemeenschappen; Schelde, Maas en IJzer; een aantal regio's van België: Kempen, Hoge Venen, kuststreek, Ardennen; Noordzee en Middellandse Zee; de werelddelen: Afrika, Antarctica, Azië, Europa, Oceanië, Noord-Amerika en Zuid-Amerika; de Grote Oceaan, Atlantische Oceaan en Indische Oceaan; de vulkaan: de Etna.", "ikdoel": "Ik ken de naam en ligging van mijn gemeente en buurgemeenten, mijn regio, de Belgische provincies en hun hoofdplaatsen, de buurlanden, de gewesten en gemeenschappen, de rivieren Schelde/Maas/IJzer, een aantal Belgische regio's (Kempen, Hoge Venen, kuststreek, Ardennen), de Noordzee en Middellandse Zee, de werelddelen, de Grote/Atlantische/Indische Oceaan en de vulkaan de Etna.", "checkvragen": ["Kun je op een blinde kaart van België je eigen provincie en de hoofdplaats ervan aanduiden?", "Welke landen grenzen aan België, en welke rivieren ken je in België?", "Op welk werelddeel ligt de vulkaan de Etna, en welke oceaan grenst aan België?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.1.1a", "onderwerp": "Topografie", "subthema": "Topografisch referentiekader", "doelzin": "de schoolgemeente en eventuele deelgemeenten, en buurgemeenten; de eigen regio; de Belgische provincies met hun hoofdplaatsen; de buurlanden van België; de gewesten en gemeenschappen", "ikdoel": "Ik ken de naam en ligging van mijn schoolgemeente met eventuele deelgemeenten en buurgemeenten, mijn regio, de Belgische provincies met hun hoofdplaatsen, de buurlanden van België, en de gewesten en gemeenschappen.", "checkvragen": ["Welke gemeenten grenzen aan jouw schoolgemeente, en in welke provincie ligt die?", "Noem de hoofdplaats van je eigen provincie, en van minstens twee andere Belgische provincies.", "Welke gewesten en gemeenschappen kent België, en welke landen grenzen aan België?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.1.1b", "onderwerp": "Topografie", "subthema": "Topografisch referentiekader", "doelzin": "Schelde, Maas en IJzer; een aantal regio's van België: Kempen, Hoge Venen, kuststreek, Ardennen; Noordzee en Middellandse Zee", "ikdoel": "Ik ken de rivieren Schelde, Maas en IJzer, een aantal Belgische regio's (Kempen, Hoge Venen, kuststreek, Ardennen), en de Noordzee en Middellandse Zee.", "checkvragen": ["Noem de drie grote Belgische rivieren die je kent.", "In welke Belgische regio verwacht je de meeste bossen en heuvels: de Kempen, de Ardennen of de kuststreek?", "Aan welke zee grenst België?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.1.1c", "onderwerp": "Topografie", "subthema": "Topografisch referentiekader", "doelzin": "de werelddelen; de Grote Oceaan, Atlantische Oceaan en Indische Oceaan; de vulkaan: de Etna", "ikdoel": "Ik ken de werelddelen, de Grote Oceaan, de Atlantische Oceaan, de Indische Oceaan, en de vulkaan de Etna.", "checkvragen": ["Welke werelddelen kun je opnoemen?", "Welke oceanen ken je, en kun je er één aanwijzen op een wereldkaart?", "Op welk werelddeel ligt de vulkaan de Etna?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.1.2", "onderwerp": "Topografie", "subthema": "Relatieve en absolute ligging", "doelzin": "De leerlingen kennen de volgende begrippen met betrekking tot relatieve ligging: de hoofdwindrichtingen, de tussenwindrichtingen, het noorden, het oosten, het zuiden, het westen, het noordoosten, het zuidoosten, het zuidwesten, het noordwesten, N, O, Z, W, NO, ZO, ZW, NW.", "ikdoel": "Ik ken de hoofdwindrichtingen en tussenwindrichtingen (noorden, oosten, zuiden, westen, noordoosten, zuidoosten, zuidwesten, noordwesten) en hun afkortingen (N, O, Z, W, NO, ZO, ZW, NW).", "checkvragen": ["Welke vier hoofdwindrichtingen ken je, en wat zijn hun afkortingen?", "Wat is de tussenwindrichting tussen het noorden en het oosten, en hoe wordt die afgekort?", "Als je van het noorden naar het zuiden een kwartslag draait, in welke richting kijk je dan?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.1.3", "onderwerp": "Topografie", "subthema": "Relatieve en absolute ligging", "doelzin": "De leerlingen kennen de volgende begrippen met betrekking tot absolute plaatsbepaling: de thuisgemeente en de postcode, de schoolgemeente en de postcode; de nulmeridiaan, de evenaar; het noordelijk halfrond, het zuidelijk halfrond, het oostelijk halfrond en het westelijk halfrond.", "ikdoel": "Ik ken mijn thuisgemeente en postcode, mijn schoolgemeente en postcode, en de begrippen nulmeridiaan, evenaar, en het noordelijk/zuidelijk/oostelijk/westelijk halfrond.", "checkvragen": ["Wat is de postcode van je eigen gemeente en van je schoolgemeente?", "Wat is het verschil tussen de evenaar en de nulmeridiaan?", "Op welk halfrond ligt België: noordelijk of zuidelijk, en oostelijk of westelijk?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.2.1", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kenmerken van de aarde en haar atmosfeer", "doelzin": "De leerlingen kennen de volgende begrippen met betrekking tot kenmerken van de aarde en haar atmosfeer: ‘de blauwe planeet', het zoet en zout water, de atmosfeer; de verschillende lagen van de aarde en hun relatieve temperatuur.", "ikdoel": "Ik ken de aarde als 'de blauwe planeet', het verschil tussen zoet en zout water, wat de atmosfeer is, en de verschillende lagen van de aarde met hun relatieve temperatuur.", "checkvragen": ["Waarom wordt de aarde ook 'de blauwe planeet' genoemd?", "Wat is het verschil tussen zoet water en zout water, en waar vind je elk?", "Welke lagen heeft de aarde, en welke laag is het warmst?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.2.2", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kenmerken van de aarde en haar atmosfeer", "doelzin": "De leerlingen kennen het concept waterkringloop: verdamping, condensatie, wolken, neerslag, grondwater, oppervlaktewater.", "ikdoel": "Ik ken het concept waterkringloop: verdamping, condensatie, wolken, neerslag, grondwater en oppervlaktewater.", "checkvragen": ["Leg de waterkringloop uit, van verdamping tot neerslag.", "Wat is het verschil tussen grondwater en oppervlaktewater?", "Wat gebeurt er tijdens condensatie, en wat is het gevolg daarvan?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.2.3", "onderwerp": "Aardrijkskundige kennis", "subthema": "Kenmerken van de aarde en haar atmosfeer", "doelzin": "De leerlingen kennen de kenmerken, oorzaken en gevolgen van vulkanen: waarom vulkanen uitbarsten: magma, lava, vulkaanpijp, krater; hoe vulkanen het landschap en menselijke activiteiten (landbouw, toerisme) kunnen beïnvloeden: aswolk, mineralen.", "ikdoel": "Ik ken de kenmerken, oorzaken (magma, lava, vulkaanpijp, krater) en gevolgen (invloed op landschap, landbouw, toerisme, aswolk, mineralen) van vulkanen.", "checkvragen": ["Wat gebeurt er met magma en lava wanneer een vulkaan uitbarst?", "Welke twee delen van een vulkaan zorgen ervoor dat lava naar buiten komt?", "Geef een voorbeeld van hoe een vulkaanuitbarsting zowel schade als voordeel kan opleveren voor mensen."]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.2.4", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "De leerlingen kennen de volgende begrippen met betrekking tot natuurlijke aspecten van landschappen, inclusief de vorming en het proces ervan: het reliëf: de bergketen, het zeeniveau, de horizonlijn, de hoogte, het hoogteverschil; de riviervorming en -processen: de bron, de smeltende ijskappen en gletsjers, de typische kenmerken van beneden-, midden- en bovenloop van rivieren, het eroderen, het afzetten, de waterval, de meander, het estuarium, de delta; de vegetatie: het loofbos, het naaldbos; de bodem: het zand, de reatie en het toerisme: het sportterrein, de entertainmentfaciliteit.", "ikdoel": "Ik ken infrastructuur in landschappen: wonen (rijhuis, vrijstaand huis, appartementsgebouw, stedelijk/landelijk), transport (snelweg, kanaal, (lucht)haven), landbouw (akkerbouw, veeteelt, gemengde landbouw, tuinbouw, glastuinbouw, irrigatie, verwerking en distributie), water als hulpbron (dam, reservoir, waterkracht, vervuiling van waterhabitats), handel (kantoor, bank, winkelcentrum) en recreatie (sportterrein, entertainmentfaciliteit).", "checkvragen": ["Wat is het verschil tussen stedelijke en landelijke bebouwing, en geef van elk een voorbeeld.", "Wat is irrigatie, en waarom gebruikt de landbouw die?", "Op welke manier kan water zowel een hulpbron als een bron van vervuiling zijn?"]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.2.5a", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "het wonen: het rijhuis, het vrijstaand huis, het appartementsgebouw, stedelijk, landelijk, de stad", "ikdoel": "Ik ken woonvormen: het rijhuis, het vrijstaand huis, het appartementsgebouw, en het onderscheid tussen stedelijk en landelijk wonen, en de stad.", "checkvragen": ["Wat is het verschil tussen een rijhuis en een vrijstaand huis?", "Wat betekent \"stedelijk\" wonen, in tegenstelling tot \"landelijk\" wonen?", "Geef een voorbeeld van een woonvorm die je typisch in een stad terugvindt."]}, {"niveau": "lager", "vak": "Aardrijkskunde", "leerjaar": 4, "leerjaarLabel": "4e leerjaar", "doelcode": "4.2.5b", "onderwerp": "Aardrijkskundige kennis", "subthema": "Landschappen: natuurlijke en menselijke aspecten", "doelzin": "de transportinfrastructuur: de snelweg, het kanaal, de (lucht)haven", "ikdoel": "Ik ken transportinfrastructuur: de snelweg, het kanaal en de (lucht)haven.", "checkvragen": ["Wat is het verschil tussen een snelweg en een kanaal als transportweg?", "Wat gebeur in mijn jaszakken: 4 in de ene, 2 in de andere; dus 6 is gesplitst in een groepje van 4 en een groepje van 2 >; delen als verdelingsdeling.; < bv. ik heb 8 knikkers en verdeel ze over 2 vrienden, hoeveel elk? >.", "ikdoel": null, "checkvragen": []}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.2.2a", "onderwerp": "Bewerkingen", "subthema": "Overkoepelend deel: begripsvorming, eigenschappen van en relaties tussen bewerkingen", "doelzin": "optellen en aftrekken als oorzaak-verandering, combinatie en vergelijking (met concrete materialen tot en met 10)", "ikdoel": "Ik voer met concrete materialen, tot en met 10, optel- en aftrekhandelingen uit en verwoord ze, als oorzaak-verandering (bv. ik heb 5 knikkers en win er 2 bij), als combinatie (bv. ik heb 5 knikkers en jij hebt er 2, hoeveel samen?) en als vergelijking (bv. hoeveel heb jij er minder?).", "checkvragen": ["Los op: je hebt 5 knikkers en wint er 2 bij, hoeveel heb je er nu?", "Los op: jij hebt 5 knikkers en je vriend heeft er 2, hoeveel hebben jullie samen?", "Los op: jij hebt 5 knikkers en je vriend heeft er 2, hoeveel heeft je vriend er minder?"]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.2.2b", "onderwerp": "Bewerkingen", "subthema": "Overkoepelend deel: begripsvorming, eigenschappen van en relaties tussen bewerkingen", "doelzin": "vermenigvuldigen als keerhandeling (met concrete materialen tot en met 10)", "ikdoel": "Ik voer met concrete materialen, tot en met 10, een vermenigvuldiging uit als keerhandeling (bv. ik heb 2 zakjes met 3 knikkers, hoeveel knikkers in totaal?).", "checkvragen": ["Los op: je hebt 2 zakjes met elk 3 knikkers, hoeveel knikkers heb je in totaal?", "Wat betekent \"keer nemen\" bij het rekenen met knikkers?", "Bedenk zelf een gelijkaardig voorbeeld met zakjes en knikkers."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.2.2c", "onderwerp": "Bewerkingen", "subthema": "Overkoepelend deel: begripsvorming, eigenschappen van en relaties tussen bewerkingen", "doelzin": "splitsen van een aantal (met concrete materialen tot en met 10)", "ikdoel": "Ik splits met concrete materialen een aantal tot en met 10 (bv. 6 noten verdeeld over twee jaszakken: 4 in de ene, 2 in de andere).", "checkvragen": ["Splits 6 knikkers in twee groepjes op twee verschillende manieren.", "Wat betekent het om een aantal te \"splitsen\"?", "Als je 6 splitst in 4 en 2, wat is dan de andere mogelijke splitsing met 6?"]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.2.2d", "onderwerp": "Bewerkingen", "subthema": "Overkoepelend deel: begripsvorming, eigenschappen van en relaties tussen bewerkingen", "doelzin": "delen als verdelingsdeling (met concrete materialen tot en met 10)", "ikdoel": "Ik voer met concrete materialen, tot en met 10, een deling uit als verdelingsdeling (bv. 8 knikkers verdelen over 2 vrienden, hoeveel elk?).", "checkvragen": ["Los op: je hebt 8 knikkers en verdeelt ze eerlijk over 2 vrienden, hoeveel krijgt elke vriend?", "Wat betekent \"eerlijk verdelen\"?", "Kun je 8 knikkers ook eerlijk verdelen over 3 vrienden? Leg uit waarom (niet)."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.1", "onderwerp": "Meten en metend rekenen", "subthema": "Overkoepelende meetinzichten en vaardigheden", "doelzin": "De kleuters kennen de volgende meetinzichten [I]: we meten geen objecten maar grootheden van objecten; < bv. we meten geen aquarium, maar de lengte, de inhoud en de massa van een aquarium >; bij een meting gaan we na hoe vaak de natuurlijke maateenheid in de te meten grootheid gaat.", "ikdoel": "Ik weet dat we grootheden van objecten meten, niet de objecten zelf, en dat we bij een meting nagaan hoe vaak de maateenheid in de te meten grootheid past.", "checkvragen": ["Wat is het verschil tussen een object meten en een grootheid van een object meten?", "Wat ga je na wanneer je iets meet?", "Geef een voorbeeld van een grootheid die je van een voorwerp kan meten."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.2", "onderwerp": "Meten en metend rekenen", "subthema": "Overkoepelende meetinzichten en vaardigheden", "doelzin": "De kleuters kennen het principe van conservatie: bepaalde handelingen veranderen niets aan de lengte, inhoud en massa van een object [I]. (< bv. een touw oprollen verandert niets aan de lengte, een stuk ervan afknippen wel >).", "ikdoel": "Ik ken het principe van conservatie: bepaalde handelingen veranderen niets aan de lengte, inhoud of massa van een object.", "checkvragen": ["Verandert de lengte van een touw als je het oprolt? Waarom (niet)?", "Verandert de lengte van een touw als je een stuk afknipt? Waarom?", "Geef nog een voorbeeld van een handeling die niets verandert aan lengte, inhoud of massa."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.3", "onderwerp": "Meten en metend rekenen", "subthema": "Overkoepelende meetinzichten en vaardigheden", "doelzin": "De kleuters kennen het principe van samenstellen [I]. (< bv. beseffen dat 2 (of meer) touwen samen even lang kunnen zijn als 1 lang touw of dat een emmer gevuld kan worden door de inhoud van verschillende waterflesjes en verschillende bekers samen te voegen >).", "ikdoel": "Ik ken het principe van samenstellen: kleinere hoeveelheden kunnen samen gelijk zijn aan een grotere.", "checkvragen": ["Kunnen twee kortere touwen samen even lang zijn als één lang touw? Leg uit.", "Kan een emmer gevuld worden door het water van verschillende flesjes samen te voegen?", "Geef een eigen voorbeeld van samenstellen."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.4", "onderwerp": "Meten en metend rekenen", "subthema": "Lengte - oppervlakte - inhoud/volume", "doelzin": "De kleuters kennen de volgende begrippen [F]: (even) lang, kort, hoog, laag, ver, dichtbij, breed, smal, dik, dun, diep, groot, klein, (bijna) vol, (bijna) leeg, veel, weinig; langer, korter, hoger, lager, verder, dichter, breder, smaller, dikker, dunner, dieper, groter, kleiner, leger, voller, meer, minder; langste, kortste, hoogste, laagste, dikste, dunste, diepste, grootste, kleinste, meeste, minste.", "ikdoel": "Ik gebruik en versta begrippen over lengte, oppervlakte, inhoud en massa: lang/kort, hoog/laag, ver/dichtbij, breed/smal, dik/dun, diep, groot/klein, vol/leeg, veel/weinig, en de vergrotende en overtreffende trap ervan.", "checkvragen": ["Benoemt correct welk van twee voorwerpen langer, hoger of dieper is.", "Wijst het grootste of het kleinste voorwerp aan in een groep.", "Gebruikt een vergelijkend begrip (bv. \"breder\", \"dunner\") correct in een zin."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.5", "onderwerp": "Meten en metend rekenen", "subthema": "Lengte - oppervlakte - inhoud/volume", "doelzin": "De kleuters kunnen lengte, oppervlakte en inhoud/volume kwalitatief: vergelijken; (on)gelijk maken; ordenen (seriëren); samenstellen.", "ikdoel": "Ik vergelijk, maak (on)gelijk, orden en stel samen lengte, oppervlakte en inhoud/volume kwalitatief.", "checkvragen": ["Vergelijkt twee voorwerpen op lengte en benoemt welke langer is.", "Maakt twee hoeveelheden gelijk door toe te voegen of weg te nemen.", "Ordent drie voorwerpen van kort naar lang."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.6", "onderwerp": "Meten en metend rekenen", "subthema": "Lengte - oppervlakte - inhoud/volume", "doelzin": "De kleuters kunnen lengte en inhoud kwantitatief: meten met natuurlijke maten; < bv. kijken hoeveel bekers nodig zijn om een drinkbus te vullen >; meten met meetinstrumenten voor natuurlijke maten (eventueel zelfgemaakt); < bv. een volle drinkbus overgieten in een fles met hoeveelheidsmarkeringen >; schematisch noteren (metingen tot en met 10).", "ikdoel": "Ik meet lengte en inhoud kwantitatief met natuurlijke maten en meetinstrumenten, en noteer schematisch tot en met 10.", "checkvragen": ["Meet hoeveel bekers water nodig zijn om een fles te vullen.", "Gebruikt een zelfgemaakt meetinstrument om een lengte te meten.", "Noteert een meting schematisch (bv. met streepjes) tot en met 10."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.7", "onderwerp": "Meten en metend rekenen", "subthema": "Massa", "doelzin": "De kleuters kennen de volgende begrippen [F]: (even) zwaar, (even) licht; zwaarder, lichter; zwaarste, lichtste.", "ikdoel": "Ik gebruik en versta begrippen over massa: (even) zwaar, (even) licht, zwaarder, lichter, zwaarste, lichtste.", "checkvragen": ["Benoemt correct welk van twee voorwerpen zwaarder is.", "Wijst het lichtste voorwerp aan in een groep.", "Gebruikt \"zwaarder\" of \"lichter\" correct in een zin."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.8", "onderwerp": "Meten en metend rekenen", "subthema": "Massa", "doelzin": "De kleuters kunnen massa kwalitatief: vergelijken; (on)gelijk maken; < bv. maak een balletje dat zwaarder is >; ordenen (seriëren); samenstellen.", "ikdoel": "Ik vergelijk, maak (on)gelijk, orden en stel samen massa kwalitatief.", "checkvragen": ["Vergelijkt twee voorwerpen op gewicht met de handen of een balans.", "Maakt een balletje zwaarder zodat het gelijk weegt aan een ander.", "Ordent drie voorwerpen van licht naar zwaar."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.9", "onderwerp": "Meten en metend rekenen", "subthema": "Massa", "doelzin": "De kleuters kunnen massa kwantitatief: meten met natuurlijke maten; < bv. zandzakjes >; meten met een (eventueel zelfgemaakte) balans; schematisch noteren (metingen tot en met 10).", "ikdoel": "Ik meet massa kwantitatief met natuurlijke maten en een (zelfgemaakte) balans, en noteer schematisch tot en met 10.", "checkvragen": ["Meet met zandzakjes hoe zwaar een voorwerp is.", "Gebruikt een balans om twee voorwerpen te vergelijken.", "Noteert een gewichtsmeting schematisch tot en met 10."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.10", "onderwerp": "Meten en metend rekenen", "subthema": "Geld", "doelzin": "De kleuters kennen munten en biljetten om dingen te kopen [I].", "ikdoel": "Ik ken munten en biljetten om dingen mee te kopen.", "checkvragen": ["Herkent een muntstuk en een biljet wanneer die getoond worden.", "Weet dat je met muntstukken en biljetten kan betalen.", "Wijst het geld aan tijdens een winkelrollenspel."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.11", "onderwerp": "Meten en metend rekenen", "subthema": "Geld", "doelzin": "De kleuters kennen de volgende begrippen [F]: betalen, geven, krijgen, kopen, ruilen, verkopen, sparen; kost meer, kost minder; prijs; euro.", "ikdoel": "Ik gebruik en versta begrippen over geld: betalen, geven, krijgen, kopen, ruilen, verkopen, sparen, kost meer, kost minder, prijs, euro.", "checkvragen": ["Gebruikt het woord \"betalen\" of \"kopen\" correct tijdens een winkelrollenspel.", "Benoemt of iets \"meer\" of \"minder\" kost dan iets anders.", "Gebruikt het woord \"euro\" correct wanneer over geld gesproken wordt."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.12", "onderwerp": "Meten en metend rekenen", "subthema": "Geld", "doelzin": "De kleuters kunnen bij een object een prijs (tot en met 10 euro) schematisch noteren. (< bv. met bolletjes of streepjes >).", "ikdoel": "Ik noteer bij een object een prijs (tot en met 10 euro) schematisch, bijvoorbeeld met bolletjes of streepjes.", "checkvragen": ["Noteert een prijs van 5 euro met vijf bolletjes of streepjes.", "Leest een schematisch genoteerde prijs af.", "Vergelijkt twee schematisch genoteerde prijzen met elkaar."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.13", "onderwerp": "Meten en metend rekenen", "subthema": "Geld", "doelzin": "De kleuters kunnen (ronde) prijzen (tot en met 10 euro) lezen.", "ikdoel": "Ik lees (ronde) prijzen tot en met 10 euro.", "checkvragen": ["Leest een prijskaartje met een rond bedrag correct af, tot 10 euro.", "Benoemt welke van twee prijzen hoger is.", "Herkent het cijfer op een prijskaartje."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.14", "onderwerp": "Meten en metend rekenen", "subthema": "Geld", "doelzin": "De kleuters kunnen betalen met muntstukken van 1 euro (tot en met 10 euro).", "ikdoel": "Ik betaal met muntstukken van 1 euro tot en met 10 euro.", "checkvragen": ["Telt het juiste aantal munten van 1 euro af voor een prijs tot 10 euro.", "Betaalt tijdens een winkelrollenspel met de juiste hoeveelheid munten.", "Controleert of het genoeg munten heeft afgeteld voor de prijs."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.15", "onderwerp": "Meten en metend rekenen", "subthema": "Geld", "doelzin": "De kleuters kunnen 1 of meer objecten kopen met een totaalbedrag tot en met 10 euro.", "ikdoel": "Ik koop 1 of meer objecten met een totaalbedrag tot en met 10 euro.", "checkvragen": ["Telt het totaalbedrag van twee gekozen objecten samen, tot en met 10 euro.", "Betaalt het juiste totaalbedrag voor meerdere gekochte objecten.", "Controleert of het genoeg geld heeft voor de gekozen aankopen."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.16", "onderwerp": "Meten en metend rekenen", "subthema": "Tijdstip en tijdsduur", "doelzin": "De kleuters kennen de dagen van de week [F].", "ikdoel": "Ik ken de dagen van de week.", "checkvragen": ["Somt de dagen van de week op in de juiste volgorde.", "Benoemt welke dag na een gegeven dag komt.", "Wijst de juiste dag aan op een weekkalender."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.17", "onderwerp": "Meten en metend rekenen", "subthema": "Tijdstip en tijdsduur", "doelzin": "De kleuters kennen de volgende begrippen [F]: eerder, vroeger, later, eerst, dan, daarna, laatst; (te) laat, (te) vroeg; straks; (even) lang, (even) kort; langer, korter; langst, kortst; vandaag, gisteren, morgen; de dag, de week, het jaar.", "ikdoel": "Ik gebruik en versta begrippen over tijdstip en tijdsduur: eerder, vroeger, later, eerst, dan, daarna, laatst, (te) laat, (te) vroeg, straks, lang/kort, langer/korter, vandaag, gisteren, morgen, de dag, de week, het jaar.", "checkvragen": ["Gebruikt \"eerst\" en \"daarna\" correct om een volgorde van gebeurtenissen te beschrijven.", "Benoemt of iets \"vandaag\", \"gisteren\" of \"morgen\" gebeurt.", "Gebruikt \"langer\" of \"korter\" correct om twee tijdsduren te vergelijken."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.18", "onderwerp": "Meten en metend rekenen", "subthema": "Tijdstip en tijdsduur", "doelzin": "De kleuters kunnen zeggen welke dag van de week het vandaag is, welke dag het gisteren was en welke dag het morgen zal zijn.", "ikdoel": "Ik zeg welke dag van de week het vandaag is, welke dag het gisteren was en welke dag het morgen zal zijn.", "checkvragen": ["Benoemt correct welke dag het vandaag is.", "Benoemt correct welke dag het gisteren was.", "Benoemt correct welke dag het morgen zal zijn."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.19", "onderwerp": "Meten en metend rekenen", "subthema": "Tijdstip en tijdsduur", "doelzin": "De kleuters kunnen gebeurtenissen tijdens de dag chronologisch ordenen (seriëren).", "ikdoel": "Ik orden gebeurtenissen tijdens de dag chronologisch.", "checkvragen": ["Legt afbeeldingen van de dagindeling in de juiste volgorde.", "Vertelt wat er eerst en wat er daarna gebeurt tijdens een normale schooldag.", "Herstelt de juiste volgorde wanneer twee momenten van de dag omgewisseld zijn."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.20", "onderwerp": "Meten en metend rekenen", "subthema": "Tijdstip en tijdsduur", "doelzin": "De kleuters kunnen aftellen tussen nu en speciale gebeurtenissen binnen de periode van een week. (< bv. ik ben over 2 dagen jarig >).", "ikdoel": "Ik tel af tussen nu en een speciale gebeurtenis binnen een week, bijvoorbeeld \"ik ben over 2 dagen jarig\".", "checkvragen": ["Telt af hoeveel dagen het nog is tot een aangekondigde gebeurtenis, binnen een week.", "Gebruikt een aftelkalender voor een aankomende gebeurtenis.", "Benoemt correct hoeveel \"nachtjes slapen\" het nog is tot een gebeurtenis."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLabel": "3e kleuterklas", "doelcode": "2.3.21", "onderwerp": "Meten en metend rekenen", "subthema": "Tijdstip en tijdsduur", "doelzin": "De kleuters kunnen de duur van een activiteit meten met een meetinstrument. (< bv. met een zandloper >).", "ikdoel": "Ik meet de duur van een activiteit met een meetinstrument, bijvoorbeeld een zandloper.", "checkvragen": ["Gebruikt een zandloper om te zien hoe lang een activiteit duurt.", "Vergelijkt de duur van twee activiteiten met behulp van een meetinstrument.", "Benoemt of een activiteit langer of korter duurde dan verwacht, op basis van het meetinstrument."]}, {"niveau": "kleuter", "vak": "Wiskunde", "leerjaar": 0, "leerjaarLab
